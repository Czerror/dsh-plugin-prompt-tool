id: fixture
name: Fixture Template
description: 测试夹具：锚定/门控链路装配与三条提示词配置模板。
version: 1.0.0
engineCompat: ">=0.4.2"
persona:
  prefix: You are a helpful assistant.
  complete: true
  includeRuntimeContext: false
modules:
  - rule-engine
  - run-code-env
  - tool-bash-disabled
  - persistent-shell-posix
  - tool-git-bash
  - filesystem-editor
  - skill-search
layerSettings:
  subagent-start:
    maxDepth: ""
rules:
  - id: near-anchor
    name: 首句锚点
    enabled: true
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: near-anchor
          strategy: first-turn-anchor
          layer: pre-step
          configKind: ordered
          order: 0
          role: user
          position: after-user
          dedupe: session
  - id: router-guide
    name: 每轮引导
    enabled: true
    layer: pre-step
    if:
      all:
        - scope:
            modelScope: flash
        - phase:
            promoted: true
            includeSubagents: false
    then:
      - id: inject
        kind: inject-text
        config:
          id: router-guide
          strategy: guide-auto
          layer: pre-step
          configKind: ordered
          order: 10
          role: user
          position: after-user
          dedupe: batch
          params:
            complexMinChars: 120
  - id: prompt-injector
    name: preset.md 注入
    enabled: true
    layer: pre-step
    if:
      all:
        - phase:
            promoted: true
            includeSubagents: false
        - anchor:
            keys: []
            fallbackAfter: 1
    then:
      - id: inject
        kind: inject-text
        config:
          id: prompt-injector
          strategy: anchor-notice
          layer: pre-step
          configKind: ordered
          order: 20
          role: user
          position: before-all
          dedupe: session
          sourceKind: plugin
configOrder:
  near-anchor: 0
  router-guide: 10
  prompt-injector: 20
