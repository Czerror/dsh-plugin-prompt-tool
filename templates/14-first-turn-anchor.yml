# 直接匹配真实用户消息，再以普通动作注入自定义正文。
# 确认词与正文由用户填写；复制分支可表达不同任务的注入规则。
id: example-first-turn-anchor
name: 示例：匹配后注入
enabled: false
layer: pre-step
if:
  text:
    subject: userMessage
    keys: [自定义触发词]
then:
  - id: inject
    kind: inject-text
    config:
      id: example-first-turn-anchor
      layer: pre-step
      strategy: static
      position: after-user
      dedupe: session
      configKind: ordered
      order: 0
      role: user
      mergeMode: separate
      sourceKind: plugin
      form: notice
      params:
        text: "" # 自定义正文
