# 模板：首句锚点（strategy=first-turn-anchor）
# 首条真实用户消息后按任务类型（build / inspect / deep）注入锚句，每会话一次。
# 纯净模板：参数全部留空，由用户自定义；默认锚句与正则见 anchored 预设 params。
# 提示：把本文件放入 promptConfigsDir 目录，或把对象写入 settings.promptConfigs 数组。
id: example-first-turn-anchor
name: 示例：首句锚点
enabled: false
layer: pre-step
strategy: first-turn-anchor
position: after-user
dedupe: session
promotion: none
modelScope: all
configKind: ordered
order: 0
role: user
mergeMode: separate
sourceKind: ''
form: notice
params:
  useCustom: false
  firstTurnText: ""
  buildPattern: ""      # 构建任务正则；留空 = 该分类不生效
  complexPattern: ""    # 复杂任务正则；留空 = 该分类不生效
  firstTurnBuild: ""    # 构建任务锚句（示例见 anchored preset.yml params.firstTurnBuild）
  firstTurnInspect: ""  # 排查任务锚句（示例见 anchored preset.yml params.firstTurnInspect）
  firstTurnDeep: ""     # 复杂设计锚句（示例见 anchored preset.yml params.firstTurnDeep）
