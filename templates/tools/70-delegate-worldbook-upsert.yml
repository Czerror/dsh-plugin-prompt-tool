# 自定义工具模板：委托内置 world_book_upsert（有参包装示例）。
# 模型只见本模板声明的参数（name/content/keys），其余字段走 execute.args 固定映射：
# constant/order/layer/position 由模板锁定——参数面 = 官方工具定义的 parameters 定制。
# 保存该模板时自动装配 world-book-tools，原工具仍可用（delegate 仅自定义名称/描述/参数面）。
id: delegate-worldbook-upsert
name: my_worldbook_upsert
description: 新增/更新一条世界书条目（委托内置工具，常驻注入）
parameters:
  name:
    type: string
    required: true
    description: 条目名称/注释
  content:
    type: string
    required: true
    description: 条目内容（命中后注入）
  keys:
    type: array
    items: { type: string }
    description: 触发关键字
output:
  schema:
    type: object
    additionalProperties: true
    properties:
      ok: { type: boolean }
      value: { type: json }
execute:
  kind: delegate
  tool: world_book_upsert
  args:
    name: '{{args.name}}'
    content: '{{args.content}}'
    keys: '{{args.keys}}'
    constant: true
    order: 100
