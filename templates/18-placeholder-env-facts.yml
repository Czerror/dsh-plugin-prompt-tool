# 模板：placeholder 动态填充位（fill 下拉可切换三种数据源）
#   - env-facts（机器事实）：默认输出 Environment facts 列表；envKeys 白名单
#   - skill-catalog（技能目录）：宿主 skills 服务（按 skillSwitches 过滤）；limit/fields/providers
#   - instruction-hint（指令文件提示）：等价快捷写法 strategy=instruction-hint；
#     promotion=include-subagents 子代理晋升后同样注入；sourceKind=instruction-hint + form=hint
# 可用 text 模板 + {{变量}} 完全自定义。
id: example-placeholder
layer: pre-step
strategy: placeholder
fill: env-facts
position: after-all
dedupe: session
promotion: include-subagents
text: |-
  
params:
  envKeys: ""       # 环境变量白名单（逗号分隔）；留空 = 默认 DSH_HOME,DSH_WORKSPACE
  limit: 20         # skill-catalog：条目数上限
  fields: name,description  # skill-catalog：输出字段
  providers: ''     # skill-catalog：提供方过滤
  emptyBehavior: skip       # skill-catalog：空结果行为
  emptyText: ""     # skill-catalog：emptyBehavior=text 时的提示；留空 = 空文本
