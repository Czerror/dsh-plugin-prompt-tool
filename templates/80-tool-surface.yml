# 模板：工具面收窄（核心文件与任务集）+ 按需解锁
#
# `tool-visibility` 声明常驻集、目录与 SDK 正文的呈现、执行闸和发现来源。
# 首轮提示由同规则的普通注入动作组合；常驻名单只写一次。
#
# 本模板只带规则、不带 `modules` 声明：用模板建模块时要自己把提供方行带进装配。
# `requireMatch` 只在名单**全部**缺失时放弃裁剪；缺一两个提供方只是少一个常驻工具，
# 收窄照常生效（提供方被替换或关闭不是声明错位）。替换提供方的名字写进 allow：
# 随包模板只写官方名，未安装替换插件的部署里该名字不存在，不产生任何影响。
#
# 发现适配器由 `tool-search` 行提供（模块必须列该行）；解锁名从持久 `tool/call` 参数回收，
# 因此下一步请求即可见，压缩遮蔽后仍然保留。
id: tool-surface-resident
name: 工具面收窄（核心文件与任务集）
enabled: true
then:
  - id: narrow-tools
    kind: tool-visibility
    allow:
      - pwsh
      - read
      - write
      - edit
      - glob
      - grep
      - todo_write
      - skill_search
      - skill_load
      - tool_search
      # 平台各自的 bash 名；替换提供方（如 ops_bash）登记在部署层名单里。
      - bash
    discovery: { kind: tools }
    # 名单里的名字一个都不存在时才放弃裁剪、暴露完整目录（fail-open）；
    # 部分缺失不触发放宽——提供方被替换或关闭是正常部署差异。
    requireMatch: true
  - if:
      count:
        of: user-message
        max: 1
    then:
      - id: discovery-notice
        kind: inject-text
        config:
          layer: pre-step
          strategy: placeholder
          fill: tool-catalog
          position: after-all
          dedupe: session
          text: 常驻工具：{{RESIDENT_TOOLS}}。缺少所需工具时，先用 {{DISCOVERY_TOOL}} 搜索并解锁。
          params:
            action: narrow-tools
