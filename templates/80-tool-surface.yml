# 模板：工具面收窄（核心文件与任务集）+ 按需解锁
#
# `tool-visibility` 声明常驻集、目录与 SDK 正文的呈现、执行闸和发现来源。
# 首轮提示由同规则的普通注入动作组合；常驻名单只写一次。
#
# 本模板只带规则、不带 `modules` 声明：装配里没有提供方时 `bash` 就是缺失名，
# `requireMatch` 反过来把整条收窄废掉——用模板建模块时要自己把提供方行带进装配。
# 写错名字的后果很隐蔽：allow 里的名字不存在会触发 requireMatch 的 fail-open，
# 表现为「收窄没生效」而不是报错。
#
# 发现适配器由 `tool-search` 行提供（模块必须列该行）；解锁名从持久 `tool/call` 参数回收，
# 因此下一步请求即可见，压缩遮蔽后仍然保留。
id: tool-surface-resident
name: 工具面收窄（核心文件与任务集）
enabled: true
then:
  - id: narrow-tools
    kind: tool-visibility
    allow:
      - pwsh
      - read
      - write
      - edit
      - glob
      - grep
      - todo_write
      - skill_search
      - skill_load
      - tool_search
      # 平台各自的 bash 名：装配里没有提供方时这里就是缺失名，收窄整体失效。
      - bash
    discovery: { kind: tools }
    # 任一常驻工具缺失就放弃裁剪、暴露完整目录（fail-open），避免静默裁成空目录。
    requireMatch: true
  - if:
      count:
        of: user-message
        max: 1
    then:
      - id: discovery-notice
        kind: inject-text
        config:
          layer: pre-step
          strategy: placeholder
          fill: tool-catalog
          position: after-all
          dedupe: session
          text: 常驻工具：{{RESIDENT_TOOLS}}。缺少所需工具时，先用 {{DISCOVERY_TOOL}} 搜索并解锁。
          params:
            action: narrow-tools
