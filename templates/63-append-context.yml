# 模板：工具结果之后追加一条 durable user 通知。
#
# 与 `tool-result` 的分工：`tool-result` 改写的是**工具结果本身**（replace / block），
# `append-context` 不动结果，只在结果之后追加一条 user 角色通知。
# 需要模型**再做一步**时使用 `inject-text` 的 `turn-stop` 层（模板65），
# 每个来源（模块）每轮 1 次 / 每会话 3 次的上限由引擎内置，不能配置关闭（失控的续跑会把会话卡住）。
#
# 工具名条件统一用规则级或分支级 `if.names`（取自 exec.name）。
id: example-append-context
name: 工具结果后追加上下文
enabled: false
layer: tool-pipeline
if:
  names:
    allow:
      - web_fetch
then:
  - id: note-after-tool
    kind: append-context
    text: 网络结果可能已过期；引用它时说明来源与抓取时间。
