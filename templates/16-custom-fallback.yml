# 先投递锚句，仅确认该次投递后的模型推理，再注入正文。
# 默认持续等待；需要兜底时在 anchor 下显式添加 fallbackAfter: N。
# 默认等待下一次正常请求；续跑通过既有 turn-stop 规则显式配置。
id: example-custom-fallback
name: 示例：锚句确认后注入
enabled: false
layer: pre-step
then:
  - id: seed
    kind: inject-text
    config:
      id: example-custom-fallback-seed
      layer: pre-step
      strategy: static
      position: after-user
      dedupe: session
      configKind: ordered
      order: 0
      role: user
      mergeMode: separate
      sourceKind: plugin
      form: notice
      params:
        text: "" # 自定义锚句，要求模型输出约定确认词
  - if:
      anchor:
        subject: assistantReasoning
        keys: [自定义确认词]
        after:
          action: seed
    then:
      - id: body
        kind: inject-text
        config:
          id: example-custom-fallback-body
          layer: pre-step
          strategy: static
          position: before-all
          dedupe: session
          configKind: ordered
          order: 20
          role: user
          mergeMode: separate
          sourceKind: plugin
          form: notice
          params:
            text: "" # 自定义正文
