# 模板：每轮引导（strategy=guide-auto）
# 晋升后每轮用户消息后按复杂度注入弱/深度引导；modelScope=flash 表示仅 flash 模型会话注入。
# 提示：把本文件放入 promptConfigsDir 目录，或把对象写入 settings.promptConfigs 数组。
id: example-guide-auto
name: 示例：每轮引导
enabled: true
layer: pre-step
strategy: guide-auto
position: after-user
dedupe: batch
promotion: main
subagents: none
modelScope: flash
configKind: ordered
order: 10
role: user
mergeMode: separate
sourceKind: ''
form: notice
params:
  useCustom: false
  text: ""
  guideComplexPattern: "(架构|重构|全面|详细|设计|系统|优化|分析|architecture|refactor|comprehensive|detailed|design|system|optimize|analyze)"
  guideWeak: "Router: classify this task (build or fix) now, then adopt the matching style — build: direct production; fix: inspect-first. Think deeply first, then commit and act."
  guideDeep: "Router: classify this task (build or fix) now, then adopt the matching style — build: direct production; fix: inspect-first. Think deeply about the architecture, edge cases, and integration points. Produce when your information is complete."
