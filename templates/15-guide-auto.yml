# 模板：每轮引导（strategy=guide-auto）
# 晋升后每轮用户消息后按复杂度注入弱/深度引导；modelScope=flash 表示仅 flash 模型会话注入。
# 纯净模板：参数全部留空，由用户自定义；默认引导句文本见 anchored 预设 params。
# 提示：把本文件放入 promptConfigsDir 目录，或把对象写入 settings.promptConfigs 数组。
id: example-guide-auto
name: 示例：每轮引导
enabled: true
layer: pre-step
strategy: guide-auto
position: after-user
dedupe: batch
promotion: main
modelScope: flash
configKind: ordered
order: 10
role: user
mergeMode: separate
sourceKind: ''
form: notice
params:
  useCustom: false
  text: ""
  guideComplexPattern: ""   # 复杂任务正则；留空 = 仅按文本长度 120 判定深/弱
  guideWeak: ""             # 简单任务自动引导句（示例见 anchored preset.yml params.guideWeak）
  guideDeep: ""             # 复杂任务自动引导句（示例见 anchored preset.yml params.guideDeep）
