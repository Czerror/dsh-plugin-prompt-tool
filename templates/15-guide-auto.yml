# 模板：按当前批次全部真实用户文本选择引导；正文留空，由用户填写后启用。
# minChars/maxChars 含端点；复杂度由正则或长度分支表达，无专用策略参数。
id: example-guide-auto
name: 示例：每轮引导
enabled: false
layer: pre-step
if:
  all:
    - scope:
        modelScope: flash
    - phase:
        promoted: true
        includeSubagents: false
    - text:
        subject: userMessage
        minChars: 1
then:
  - if:
      any:
        - text:
            subject: userMessage
            keys: ['复杂|重构|排查'] # 按需替换分类表达式
            useRegex: true
        - text:
            subject: userMessage
            minChars: 121
    then:
      - id: deep-guide
        kind: inject-text
        config:
          layer: pre-step
          strategy: static
          position: after-user
          dedupe: batch
          text: "" # 复杂任务引导
    else:
      - id: weak-guide
        kind: inject-text
        config:
          layer: pre-step
          strategy: static
          position: after-user
          dedupe: batch
          text: "" # 简单任务引导
