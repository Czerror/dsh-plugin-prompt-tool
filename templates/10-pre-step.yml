# 模板：pre-step 消息批注入（完整通用字段示例）
# 接入：复制本文件到 promptConfigsDir 目录，或把对象写入 settings.promptConfigs 数组。
# 保存前可 POST /api/prompt-tool/settings/configs-validate 做权威校验。
id: example-pre-step
name: 示例：消息批注入
enabled: true
layer: pre-step
strategy: static
position: after-user
dedupe: session
promotion: none
subagents: none
modelScope: all
configKind: ordered
order: 0
role: user
mergeMode: separate
sourceKind: ''
form: notice
summary: ''
identity:
  field: plugin
  value: example-pre-step
text: |-
  这是注入到用户消息后的提示词内容。
  支持 {{WORKSPACE}} / {{CWD}} / {{DSH_HOME}} 与下方 variables。
variables:
  WHO: 张三
params: {}
