# 模板：tool-pipeline 工具行为策略
#
# 工具链拆成两个动作、两个执行点：
#   - `tool-gate`（tools/pre-execute）：allow / deny / ask，只读 decision / reason；
#   - `tool-result`（tools/post-execute）：accept / replace / block，只读 action / text。
# 工具名只在共享 names 条件声明。
# 写错相位的字段在编译期就是未知字段，不会静默失效。
id: example-tool-pipeline
layer: tool-pipeline
if:
  names:
    allow: [bash, run_code]
then:
  - id: before
    kind: tool-gate
    decision: allow
    reason: 该工具被提示词配置禁用
  - id: after
    kind: tool-result
    action: accept
    text: ""
