name: Set up verification environment
description: Install the shared Node.js and pnpm toolchain and locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 26.13.0
        registry-url: https://registry.npmjs.org
    - name: Install project pnpm
      shell: pwsh
      run: |
        $prefix = Join-Path $env:RUNNER_TEMP 'project-pnpm'
        $packageManager = node -p "require('./package.json').packageManager"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $version = $null
        if ($packageManager -isnot [string] -or $packageManager -cnotmatch '\Apnpm@(.+)\z' -or
            -not [semver]::TryParse($Matches[1], [ref]$version) -or
            $packageManager -cne "pnpm@$version") {
          throw 'package.json must declare packageManager as pnpm@<exact-version>.'
        }
        npm install --global --prefix $prefix $packageManager
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $prefix
    - run: pnpm install --frozen-lockfile
      shell: pwsh
