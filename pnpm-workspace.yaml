# 本仓库只依赖已发布的官方包；不要在这里添加指向 ../deepseek-harness 的
# `overrides: link:` 默认配置。源码联调请使用不入库的显式本地配置，
# 否则发布验证会退回开发机同级源码，掩盖真实的依赖与版本问题。
#
# 下面这份清单由 pnpm 维护：pnpm 12 安装时会把 lockfile 拿去比对供应链策略
# （"Verifying lockfile against supply-chain policies"），当前安装的版本若不
# 在清单里会被拒装，随后 pnpm 重写整块为「只含当前版本」的形态——它不会囤积
# 历史版本。所以升级 DSH 后**不要手工增删**：跑一次 pnpm install 即可，
# 由 pnpm 把清单对齐到新版本。
