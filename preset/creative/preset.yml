id: creative
name: 创造模式
description: 用于创建自定义 Agent preset：具备标准模式的全部能力，并提供运行时检查、插件实验和 preset 创作指导。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-persona-cordis
  - official-agent-instructions
  - official-tool-bash
  - official-tool-pwsh
  - official-tool-fs
  - official-tool-fs-search
  - official-tool-jobs
  - official-skill-filesystem-cordis
  - official-tool-skill
  - official-tool-goal
  - official-planning
  - official-compaction
  - official-delegation
  - official-tool-ask-user
  - official-tool-todo
  - official-tool-web
  - official-tool-cordis
  - context-gate
  - tool-bootstrap
  - router-first-turn
  - prompt-config-engine
  - run-code-env
  - custom-bash
  - skill-search
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  flashPersona: "You are a helpful assistant. Before acting, decide the task type (build or fix) and adopt the matching style: build → hands-on production; fix → inspect-and-plan. Before acting, briefly review what you have already done in this session and continue from where you left off; do not repeat completed steps. Do not run environment checks (echo, whoami, uname, node --version, date) or exhaustive grep/glob scans. Think deeply first, then produce."
  subagentFlashProvider: ""
  subagentFlashModel: ""
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
