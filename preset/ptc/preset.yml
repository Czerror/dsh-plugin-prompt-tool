id: ptc
name: PTC 模式
description: 功能完整的编码 Agent，但默认不提供 workflow 工具；其他工具通过 PTC 模式 SDK 呈现，让模型用一个 TypeScript 程序组合多步操作。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation-ptc
  - tool-ask-user
  - tool-todo
  - tool-web
  - official-tool-presentation
  - prompt-config-engine
model:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
subagentModel:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
params:
  maxDepth: ""
promptConfigs:
  - id: persona-main
    name: 主会话人设
    layer: system-section
    strategy: static
    order: 0
    params:
      sectionName: deployment:persona
    text: "You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}."
