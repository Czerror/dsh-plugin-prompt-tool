id: ptc
name: PTC 模式
description: 具备标准模式的全部能力，并通过 Code Mode SDK 呈现工具，让模型用一个 TypeScript 程序组合多步操作。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - persona
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - official-tool-presentation
  - context-gate
  - tool-bootstrap
  - router-first-turn
  - prompt-config-engine
  - run-code-env
  - custom-bash
  - skill-search
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  fastModelPersona: "You are a helpful assistant. Before acting, decide the task type (build or fix) and adopt the matching style: build → hands-on production; fix → inspect-and-plan. Before acting, briefly review what you have already done in this session and continue from where you left off; do not repeat completed steps. Do not run environment checks (echo, whoami, uname, node --version, date) or exhaustive grep/glob scans. Think deeply first, then produce."
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
  # 模型路由与委派 · 主对话与子代理通用（缺省 = 官方默认 / 继承宿主）
  modelProvider: ""
  modelName: ""
  persona: ""
  toolFilterAllow: []
  toolFilterDeny: []
  maxDepth: ""
