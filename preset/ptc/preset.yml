id: ptc
name: PTC 模式
description: 具备标准模式的全部能力，并通过 Code Mode SDK 呈现工具，让模型用一个 TypeScript 程序组合多步操作。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - official-tool-presentation
  - context-gate
  - tool-bootstrap
  - code-presentation
  - prompt-config-engine
  - character-tools
  - world-book-tools
  - session-var-tools
  - run-code-env
  - custom-bash
  - skill-search
model:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
subagentModel:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
  toolFilterAllow: []
  toolFilterDeny: []
  maxDepth: ""
promptConfigs:
  - id: persona-main
    name: 主会话人设
    layer: system-section
    strategy: static
    order: 0
    params:
      sectionName: deployment:persona
    text: "You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}."
