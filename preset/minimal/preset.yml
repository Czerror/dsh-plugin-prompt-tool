id: minimal
name: 极简模式
description: 仅提供持久 bash 与 str_replace_editor 的双工具编码 Agent。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-persistent-shell
  - bootstrap-filesystem
  - context-gate
  - tool-bootstrap
  - code-presentation
  - prompt-config-engine
  - run-code-env
  - custom-bash
  - skill-search
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
  modelProvider: ""
  modelName: ""
  subagentModelProvider: ""
  subagentModelName: ""
  modelReasoningEffort: ""
  modelTemperature: ""
  modelMaxTokens: ""
  subagentReasoningEffort: ""
  subagentTemperature: ""
  subagentMaxTokens: ""
  subagentPersona: ""
  toolFilterAllow: []
  toolFilterDeny: []
  maxDepth: ""
promptConfigs:
  - id: persona-main
    name: 主会话人设
    layer: system-section
    strategy: static
    order: 0
    params:
      sectionName: deployment:persona
      complete: true
      suppressRuntimeContext: true
    text: "You are a helpful software engineer assistant."
