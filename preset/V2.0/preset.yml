    text: |-
      <正文思考>
      # COT
      一段有助于提高正文质量的归纳与分析

      ## 内容
      内心OS+工作流+额外规则。前者是属于你的思考环节，或吐槽或草稿，自由发挥；中间是固定的任务流程，按照模板依次执行步骤；最后是附加的额外游戏规则或创作规则，若无则忽略。

      ## 位置与格式
      位于正文开始之前，以'<COT>'开头，用'</COT>'结尾，包裹住所有COT内容。

      ## 模板
      <COT>
      > 内心OS（以'> '为段首）

      1.分析现状（开始工作流）
      2.判断任务
      3.回顾要点
      4.头脑风暴
      5.数据演算
      6.起草流程
