id: v2-0
name: V2.0（SillyTavern 转换）
description: "由 SillyTavern 预设「V2.0」按需转换：42 条配置（declarative/antiMark/main/nsfw/jailbreak/InertiaWaaagh/worldInfo_Start/enhanceDefinitions/worldInfo_End/FormatSet_Start/wordCount/TBC/antiSpoilersInfo/DeepSeek_adjust/antiStereotype/DIY_WritingStyle/MTdrive_MOD/ATdrive_MOD/Interactive_mode/Talker_mode/RealWorld/inner_monologue/thirdPerson/secondPerson/firstPerson/realWaaagh/fakeWaaagh/Fanatic_mode/Observer_mode/Interrogate_mode/Battle_mode/Analysis_mode/RP_mode/TimeInfo/DicePool/antiTruncation/normal_reminder/MVU_reminder/FormatSet_End/JustDoIt/StillThink/st-sampling）。modules 按需组装（persona + prompt-config-engine）。已丢弃：worldInfoBefore: 空内容；personaDescription: 空内容；charDescription: 空内容；charPersonality: 空内容；scenario: 空内容；worldInfoAfter: 空内容；dialogueExamples: 空内容；chatHistory: 空内容；chatHistory_point: 空内容；reasoning_effort: auto（dsh 仅支持 off/low/high/max）；enable_web_search: false（不启用 web 搜索）"
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - persona
  - prompt-config-engine
moduleConfigs:
  persona:
    complete: false
promptConfigs:
  - id: declarative
    name: 说明信息（别开）
    enabled: false
    strategy: static
    order: 100
    text: |-
      简单预设，简单说明：

      1. 本预设旨在采用尽可能简单的明文提示手段实现比较基本的破甲，并加入必要的文风干预/肘八股提示词，整合AIRP所需的部分常用基本功能，以便在酒馆进行AI对话测试。

      2. 默认状态下，导入并选择本预设即可开始使用，功能列表中可以自选开关的功能选项均有标注和说明，点开对应选项的编辑页面即可完整查看。

      3. 注意检查全局正则是否正确导入，新版本酒馆支持预设.json里包含正则，而旧版本只能手动导入单独的正则文件。

      4. 多数选项可以叠加使用，部分选项必须二选一（有图标和命名后缀作为提示）

      5. 关于“卡思考”：
       - 原生思维和伪造思维选项请二选一开启，前者为正常的原生思考，后者为无原生思考+正文思考
       - “正文思考”即在正文的开头，先写一段“伪-思考”，然后再写故事正文。
       - “分析模式”和“沉浸模式”为DS特供思维模式，同时开启跳过思考和XX思维模式可能导致卡COT失败。
       - 预设自带一个脚本(可能需要预设内置正则的插件才能自动导入)，在酒馆助手的脚本列表里可手动开启“禁用原生思考”

      6. 当前版本为针对DeepSeekV4-API使用环境所写，存在模型特化倾向。由于先前版本是Gemini/DeepSeek通用轻量化预设，所以目前依旧保留了大部分为兼容性考虑的提示词，不过，在使用非V4模型的情况下，依然可能出现预设效果低于预期的情况。

      7.  为同时兼容DeepSeek和Gemini注意力特征，故采用折中输入布局：
      ---
          头部提示词（主破甲）
          世界书（设定）
          对话历史
          尾部提示词（主文风、格式等）
      ---
      其中，每个区间都有分隔提示词。若需要自行缝合功能，建议在尾部提示词区间自行添加新条目。
      注：某些世界书中涉及系统/用户/助手以及插入位置/深度的条目能够绕过这一区间规划，若对生成结果不满意可先备份世界书，然后尝试自行修改。

      8. 由于DeepSeek-V4当前版本的缓存命中规则，不建议使用记忆插件和大小总结等工具或功能，它们会导致命中缓存率下降，在使用V4-PRO时若缓存未命中，可能导致api余额蒸发。此外，V4的超长上下文和稀疏注意力策略也不再依赖与传统的附加记忆手段，在上下文窗口限制内直接力大砖飞即可。

      声明:
      //
      作者:盐渍鱼
      唯一发布平台:Discord-类脑OΔYΣΣEIA
      声明：所有内容仅为学习、测试并协助提高Ai能力。本预仅供个人学习，禁止一切以非法行为为目的使用本预设，禁止以非法行为或者盈利行为为目的传播此预设。
      //
