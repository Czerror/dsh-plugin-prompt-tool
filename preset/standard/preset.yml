id: standard
name: 标准模式
description: 功能完整的编码 Agent，支持文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - context-gate
  - tool-bootstrap
  - code-presentation
  - prompt-config-engine
  - run-code-env
  - custom-bash
  - skill-search
model:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
subagentModel:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
  toolFilterAllow: []
  toolFilterDeny: []
  maxDepth: ""
promptConfigs:
  - id: persona-main
    name: 主会话人设
    layer: system-section
    strategy: static
    order: 0
    params:
      sectionName: deployment:persona
    text: "You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}."
