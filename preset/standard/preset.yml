id: standard
name: 标准模式
description: 功能完整的编码 Agent，支持文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - persona
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - context-gate
  - tool-bootstrap
  - router-first-turn
  - prompt-config-engine
  - run-code-env
  - custom-bash
  - skill-search
params:
  usePtcMode: true
  bootstrapMaxTokens: 0
  mainPersona: "You are a helpful assistant. Before acting, decide the task type (build or fix) and adopt the matching style: build → hands-on production; fix → inspect-and-plan. Before acting, briefly review what you have already done in this session and continue from where you left off; do not repeat completed steps. Do not run environment checks (echo, whoami, uname, node --version, date) or exhaustive grep/glob scans. Think deeply first, then produce."
  allowKinds: "[skill-invocation, near-anchor, router-guide]"
  # 模型路由与委派 · 主对话与子代理通用（缺省 = 官方默认 / 继承宿主）
  modelProvider: ""
  modelName: ""
  subagentModelProvider: ""
  subagentModelName: ""
  modelReasoningEffort: ""
  modelTemperature: ""
  modelMaxTokens: ""
  subagentReasoningEffort: ""
  subagentTemperature: ""
  subagentMaxTokens: ""
  subagentPersona: ""
  toolFilterAllow: []
  toolFilterDeny: []
  maxDepth: ""
