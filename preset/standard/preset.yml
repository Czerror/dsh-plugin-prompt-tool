id: standard
name: 标准模式
description: 功能完整的编码 Agent，支持文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - official-agent-instructions
  - official-tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - prompt-config-engine
model:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
subagentModel:
  provider: ""
  name: ""
  reasoningEffort: ""
  temperature: ""
  maxTokens: ""
persona:
  prefix: >-
    You are a coding agent powered by the {{model}} model.
  suffix: >-
    Your working directory is {{cwd}}.
params:
  maxDepth: ""
promptConfigs: []
