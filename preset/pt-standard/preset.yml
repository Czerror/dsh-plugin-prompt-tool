id: pt-standard
name: 标准模式
description: 功能完整的编码 Agent，支持文件编辑、Shell、文件与网页检索、Skills、计划、目标、子代理和工作流。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - agent-instructions
  - tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - tool-skill
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - tool-present
  - tool-plugin-manager-disabled
  - prompt-config-engine
persona:
  suffix: >-
    Your working directory is {{cwd}}.
  prefix: >-
    You are a coding agent powered by the {{model}} model.
promptConfigs: []
layerSettings:
  agent-request:
    modelProvider: ""
    modelName: ""
    modelReasoningEffort: ""
    modelTemperature: ""
    modelMaxTokens: ""
  subagent-start:
    subagentModelProvider: ""
    subagentModelName: ""
    subagentReasoningEffort: ""
    subagentTemperature: ""
    subagentMaxTokens: ""
    maxDepth: ""
