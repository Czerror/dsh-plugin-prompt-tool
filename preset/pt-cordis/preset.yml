id: pt-cordis
name: 创造模式
description: 用于创建自定义 Agent preset：具备标准模式的全部能力，并提供运行时检查、持久化插件管理和 preset 创作指导。
version: 1.0.0
engineCompat: ">=0.4.2"
modules:
  - agent-instructions
  - tool-bash
  - tool-pwsh
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - command-goal
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
  - skill-filesystem-cordis
  - tool-skill
  - tool-present
  - tool-plugin-manager
  - prompt-config-engine
persona:
  suffix: Your working directory is {{cwd}}.
  prefix: You are a coding agent powered by the {{model}} model.
promptConfigs: []
layerSettings:
  agent-request:
    modelProvider: ""
    modelName: ""
    modelReasoningEffort: ""
    modelTemperature: ""
    modelMaxTokens: ""
  subagent-start:
    subagentModelProvider: ""
    subagentModelName: ""
    subagentReasoningEffort: ""
    subagentTemperature: ""
    subagentMaxTokens: ""
    maxDepth: ""
