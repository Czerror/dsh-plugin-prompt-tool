# liangshen（梁神模式）—— 官方 dsh-web-ui @linxin666/dsh-liangshen 预设的
# 本插件单文件化拆解：两阶段锚定（首轮 Minimal 双工具 + promoteGate 门控晋升）
# + PTC 单 run_code 呈现 + 晋升后延迟注入（deferredSources）+ instruction-hint 转换。
# 全部机制已参数化到引擎模块（tool-bootstrap / context-gate），无本地 .mjs。
id: liangshen
name: 梁神模式
version: 1.0.0
engineCompat: ">=0.4.2"
meta:
  name: liangshen
  description: 梁神模式：首轮 Minimal 双工具锚定 + promoteGate 门控晋升 + PTC 单 run_code 呈现。
  order: 4
modules:
  - context-gate
  - tool-bootstrap
  - official-agent-instructions
  - persistent-shell
  - custom-bash
  - str-replace-editor
  - tool-fs
  - tool-fs-search
  - tool-jobs
  - skill-filesystem
  - official-tool-skill
  - tool-goal
  - planning
  - compaction
  - delegation
  - tool-ask-user
  - tool-todo
  - tool-web
moduleConfigs:
  tool-bootstrap:
    bootstrapTools: [bash, str_replace_editor]
    includeSubagents: true
    promoteGate: true
    maxPromoteSteps: 4
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 1024
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]
    usePtcMode: true
    personaSectionsOnly: true
    workspaceLine: true
  context-gate:
    messageSources: [user, goal]
    deferredSources: [agent-instructions, skill-catalog]
    deferredGraceSteps: 1
    instructionHint: true
params:
promptConfigs:
  # 晋升后注入 preset.md 内容（custom-fallback 策略：自定义锚定词命中后注入一次）。
  # phase-1 由 context-gate 的 messageSources 白名单拦截，晋升后随普通注入恢复。
  - id: prompt-injector
    name: preset.md 注入
    enabled: true
    strategy: custom-fallback
    layer: pre-step
    configKind: ordered
    order: 20
    role: user
    position: before-all
    dedupe: session
    promotion: main
    sourceKind: plugin
  - id: persona-main
    name: 主会话人设
    layer: system-section
    strategy: static
    order: 0
    params:
      sectionName: deployment:persona
    text: "You are a helpful assistant. Before acting, decide the task type (build or fix) and adopt the matching style: build → hands-on production; fix → inspect-and-plan. Before acting, briefly review what you have already done in this session and continue from where you left off; do not repeat completed steps. Do not run environment checks (echo, whoami, uname, node --version, date) or exhaustive grep/glob scans. Think deeply first, then produce."
