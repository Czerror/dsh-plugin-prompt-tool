# PTC 呈现模块 —— 把工具面切成「只暴露保留的 run_code + 生成的 SDK 段」。
#
# 形态：注册表只贡献 `run_code` 传输与 `tools:sdk` 段，其余可见能力由程序内绑定
# （`tools.xxx()`）调用；模型直接调别的工具会失败。
#
# 怎么实现的：插件 `present-as` 行在真实 Agent scope 挂载官方
# `@deepseek-ai/dsh-tool-executor-ptc`，等待异步导入与初始化，不需要改 profile patch。
# 同 scope 的执行器冲突由官方拒绝，主/子模式可分别配置。
#
# 为什么**不带规则**（`rules: []`）：官方 PTC 执行器提供调用指引与生成的
# SDK 段（各能力的程序内签名）；
# 插件侧再叠提示只是重复。本模块也不声明 `rule-engine`
# （没有规则要编译）。
#
# 前置：宿主提供 `ctx.ptcRuntime`。缺失时先告警并继续等待，晚到后才挂执行器；
# native 模式不受这项依赖限制。程序 cwd 用 `process.cwd()`，shell 操作用
# 当前工具面提供的 `tools.bash(...)` / `tools.pwsh(...)`；不提供等价 `env` 对象。
#
# 生效面：启用表或模块定义更新后，装配通道更新存活 Agent 的独立贡献。
# 卸载、禁用或运行时撤回后，新批次明确不可用，已接受批次按原执行器排空；
# 显式重挂有效执行器后恢复，不自动回退祖先或 native。新会话也需要有效执行器。
# 内置种子只补缺失，已有用户副本由用户自行调整。

id: ptc-mode
name: PTC 呈现（只暴露 run_code）
version: 1.0.0
engineCompat: ">=0.4.2"
description: 在 Agent scope 挂载官方 PTC 执行器，只声明 run_code 传输与生成的 SDK 段，其余能力由程序内绑定调用；等待宿主 PTC 运行时，卸载后新批次不可用，显式重挂恢复。
meta:
  source: manual
modules:
  # 行名与引擎模块文件同名（`engine/<行 id>.mjs`），由 Agent 装配通道挂载。
  - present-as     # PTC 呈现：注册表只贡献 run_code + SDK 段（engine/present-as.mjs）
order: 9
rules: []
