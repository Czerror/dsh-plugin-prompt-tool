id: skill-surface
name: 技能面收窄（拦截全量技能目录）
version: 1.0.0
engineCompat: ">=0.4.2"
description: 拦掉 dsh-tool-skill 注入的全量技能目录（source.kind = skill-catalog），保留真实技能正文，并提醒模型在工作前通过 skill_search / skill_load 按需发现与加载适用技能。
meta:
  source: manual
modules:
  - rule-engine
order: 6
rules:
  # 启用前置条件已满足：`skill_search` / `skill_load` 由本插件的宿主侧挂载
  # （src/index.ts 动态导入 engine/skill-search.mjs，失败只告警降级）。
  - id: skill-surface-narrowing
    name: 技能面收窄（拦截全量技能目录）
    enabled: true
    then:
      - id: drop-skill-catalog
        kind: pre-step-filter
        sources:
          - user
          - tool-jobs
          - agent-instructions
          - runtime-context
          - skill-invocation
          - agent-message
          - subagent-settled
          - 'plugin:prompt-config-engine'
          - 'plugin:ponytail-subagent-readonly'
          - 'plugin:ponytail-subagent-rules'
          - dsh-mnemon
          - compact-checkpoint
          - goal
      - id: skill-discovery-notice
        kind: inject-text
        config:
          layer: pre-step
          strategy: static
          position: after-all
          dedupe: session
          text: 开始工作前，先用 skill_search 搜索相关工作技能。准备就绪以适用技能（如有）的正文已在当前上下文并按其要求开展工作为准；已有正文可复用，其余由 skill_load 从下一次模型请求起注入。名称与简介只用于判断适用性，无适用项可继续任务，技能不可用的结论须有返回结果支持。
