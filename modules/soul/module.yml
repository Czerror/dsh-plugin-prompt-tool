# 灵魂架构（推送层 + 判据 + 按需条目 + 状态规则）
# 工具面复用本项目能力：soul_ledger 写账本，module_search/open 回取，module_file_read/append 处理其它私有文件。
# 正文放 assets/，用 templateFile 引用；运行源是本模块，soul 仓库是作者稿。
id: soul
name: 灵魂架构（判据与推送）
version: 1.0.0
engineCompat: ">=0.7.2"
description: 灵魂架构完整核心：判据、结构化账本、授权检索、动态 SELF、上下文溯源、生成恢复与默认不唤醒的维护心跳；能力按 Agent
  运行时装配，不依赖预设改装。原项目：https://github.com/cyanwell/dsh-agent-soul
meta:
  source: manual
modules:
  - rule-engine
  - module-file-tools
  - module-manifest-tools
  - module-variable-tools
  - soul-ledger
  - retrieval
  - context-provenance
  - generation-recovery
  - soul-maintenance
moduleConfigs:
  retrieval:
    enabled: true
    paths:
      - data/02-soul.jsonl
      - data/SELF.src.md
      - data/AGENTS.md
      - data/10-宪章/
      - data/20-档案/
      - data/30-状态/
      - data/40-产物索引/
      - data/50-日记/
      - data/60-工具/
      - data/65-声音/
      - data/70-收到/
      - data/75-形象/
      - data/80-科普/
      - data/90-历代根会话/
    sessions: []
    synonymsFile: assets/retrieval-synonyms.json
  context-provenance:
    enabled: true
    audience: all
    auto: true
    modelSwitch: true
    prune: true
    basic: {}
  generation-recovery:
    enabled: true
    audience: all
    recoverEmpty: true
    silentReasoningChars: 32768
    mainRecoveryLimit: 3
    subagentRecoveryLimit: 1
    maintenanceCompression: false
    allowFullFallback: false
    lineRepeatChars: 2048
    crossCallRepeatChars: 2048
    maxCycleChars: 512
  soul-maintenance:
    enabled: true
    intervalMs: 60000
    wake: false
    audience: all
    budgetBytes: 12288
    pressureThresholds:
      - 0.45
      - 0.6
      - 0.8
order: 10
variables:
  # 状态键由本模块声明；引擎只按普通模块变量处理，不认 soul 前缀。
  plan_step: ''
  plan_at: ''
  scaffold_done: ''
  scaffold_root: data
rules:
  - id: soul-core
    name: 四条判据（常驻）
    enabled: true
    layer: runtime-context
    if:
      scope:
        audience: main
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-core
          strategy: static
          layer: runtime-context
          order: 132
          params:
            contextName: agent:soul-core
          templateFile: ./assets/criteria.md

  - id: soul-self
    name: SELF（每步当前事实）
    enabled: true
    layer: runtime-context
    then:
      - id: inject
        kind: inject-text
        config:
          strategy: placeholder
          fill: soul-self
          layer: runtime-context
          order: 133
          params:
            contextName: agent:soul-self

  - id: soul-tools
    name: soul 工具速查
    enabled: true
    layer: runtime-context
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-tools
          strategy: static
          layer: runtime-context
          order: 134
          params:
            contextName: agent:soul-tools
          templateFile: ./assets/tools.md

  - id: soul-core-sub
    name: 子代理硬线
    enabled: true
    layer: subagent-start
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-core-sub
          strategy: static
          layer: subagent-start
          order: 216
          templateFile: ./assets/core-hard.md

  - id: soul-layers
    name: 五层（按需）
    enabled: true
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-layers
          strategy: context-activation
          layer: pre-step
          order: 120
          position: before-all
          role: user
          templateFile: ./assets/layers.md
          params:
            constant: false
            keys: [ 灵魂, 五层, ECHO, VITAL, 架构 ]
            secondaryKeys: []
            selectiveLogic: AND_ANY
            wordBoundary: ascii-token
            activation:
              scan: history
              scanDepth: 6
              selective: false

  - id: soul-echo
    name: ECHO 机制（按需）
    enabled: true
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-echo
          strategy: context-activation
          layer: pre-step
          order: 121
          position: before-all
          role: user
          templateFile: ./assets/echo.md
          params:
            constant: false
            keys: [ 压缩, 上下文满, 摘要, 找不回, 退化 ]
            secondaryKeys: []
            selectiveLogic: AND_ANY
            wordBoundary: ascii-token
            activation:
              scan: history
              scanDepth: 8
              selective: false

  - id: soul-vital
    name: VITAL 机制（按需）
    enabled: true
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-vital
          strategy: context-activation
          layer: pre-step
          order: 122
          position: before-all
          role: user
          templateFile: ./assets/vital.md
          params:
            constant: false
            keys: [ 预算, 烧光, 打转, 空转, 该停, 阈值 ]
            secondaryKeys: []
            selectiveLogic: AND_ANY
            wordBoundary: ascii-token
            activation:
              scan: history
              scanDepth: 8
              selective: false

  - id: soul-ledger
    name: 账本纪律（按需）
    enabled: true
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-ledger
          strategy: context-activation
          layer: pre-step
          order: 123
          position: before-all
          role: user
          templateFile: ./assets/ledger.md
          params:
            constant: false
            keys: [ 账本, 未结, 承诺, 只追加 ]
            secondaryKeys: []
            selectiveLogic: AND_ANY
            wordBoundary: ascii-token
            activation:
              scan: history
              scanDepth: 6
              selective: false

  - id: soul-post-compaction
    name: 压缩后指针纪律
    enabled: true
    layer: system-section
    if:
      phase:
        compacted: true
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-post-compaction
          strategy: static
          layer: system-section
          order: 245
          text: |-
            压缩摘要里每条结论都要能回到原文；回不去的写成检索入口，不要写成断言。继续推理前先核对前提。

  - id: soul-tick
    name: 每 12 轮自检
    enabled: true
    layer: system-section
    if:
      count:
        of: turn
        every: 12
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-tick
          strategy: static
          layer: system-section
          order: 246
          text: |-
            自检三问：压缩后丢掉的东西还能按指针找回吗？现在是不是在错误的前提上继续推理？「还能更好」和「没做完」分得开吗？

  # 状态规则：变量谓词在挂载期按来源模块（soul）读取有效值。
  # 工具主语写死 moduleId: soul；模块被复制或改名后需要同步这些正文。
  - id: soul-plan
    name: 计划纪律（首轮，未写计划时）
    enabled: true
    layer: pre-step
    if:
      all:
        - variable:
            key: plan_step
            op: eq
            value: ''
        - count:
            of: user-message
            per: session
            max: 1
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-plan
          layer: pre-step
          strategy: static
          position: before-all
          order: 124
          role: user
          text: |-
            先定一步计划再动手：用 module_variables（moduleId: soul，scope: module，action: list）读取 plan_step 与 plan_at，
            写入时 action: set，key 为 plan_step 或 plan_at，value 为一行「下一步 + 判据」，带回读取到的 expectedRevisions；计划变了就覆盖，不要留旧计划当真相。
            连续三步没有进展时停下来重写计划，而不是继续加动作。
            需要看装配进度时先 module_manifest（moduleId: soul）action=next，再决定改计划还是先装配。

  - id: soul-scaffold
    name: 书房装配（首轮，未装配时）
    enabled: true
    layer: pre-step
    if:
      all:
        - variable:
            key: scaffold_done
            op: eq
            value: ''
        - count:
            of: user-message
            per: session
            max: 1
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-scaffold
          layer: pre-step
          strategy: static
          position: before-all
          order: 125
          role: user
          text: |-
            书房还没装配：先 module_manifest（moduleId: soul）action=next 看第一条缺失，
            再 action=check 看已有文件的状况，最后由用户决定是否 action=apply。
            AGENTS.md 落在 data/AGENTS.md（模板 assets/templates/agents-template.md），已存在不覆盖，
            它不是工作区指令文件；apply 只建目录、只落缺失文件，已存在的一律不碰；
            装配完成后把 scaffold_done 置为 true。

  - id: soul-check
    name: 检查失败处置
    enabled: true
    layer: system-section
    if:
      manifest:
        ok: false
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-check
          layer: system-section
          strategy: static
          order: 247
          text: |-
            清单检查当前有未通过项：先 module_manifest（moduleId: soul）action=check 看文件明细，再 soul_state（moduleId: soul）action=check 看SELF、索引和运行证据。
            文件齐全不代表SELF已投递或能力已运行；明确哪项失败、证据和下一步，修复后重查，不以手写变量替代检查。

  - id: soul-ledger-open
    name: 未结账本提醒
    enabled: true
    layer: pre-step
    if:
      all:
        - scope:
            audience: main
        - soul:
            pending: true
    then:
      - id: inject
        kind: inject-text
        config:
          id: soul-ledger-open
          layer: pre-step
          strategy: static
          position: before-all
          order: 126
          role: user
          text: |-
            账本有未结或历史待核对事项：先用 soul_ledger（moduleId: soul，action: list，view: pending）分页核对稳定 id。
            明确完成或取消时，action: close，targetId: 该 id，outcome: completed/cancelled，reason: 非空依据；ref 仍表示出处。
            promise 仅当前 lead 收口；shelved 允许原作者或当前 lead。执行者可提交证据，不替主导确认承诺。
            暂时搁置仍是未结，不猜测历史已完成，不手工修改计数。仅主会话按集合变化或成功压缩提醒一次。
          dedupe: batch
