  - id: ponytail-subagent-level
    name: Ponytail 档位（子代理，跟随当前档位）
    enabled: true
    layer: subagent-start
    do:
      - id: inject
        kind: inject-text
        config:
          id: ponytail-subagent-level
          strategy: static
          layer: subagent-start
          order: 213
          text: |-
            PONYTAIL MODE ACTIVE

            Your level is whatever the preset's Ponytail intensity card says; a
            delegated copy cannot read it, so only this card's level marker is
            authoritative here. Default: **full**.
configOrder:
  ponytail-rules: 0
  ponytail-level-full: 10
  ponytail-level-lite: 20
  ponytail-level-ultra: 30
  ponytail-subagent-rules: 40
  ponytail-subagent-level: 50
