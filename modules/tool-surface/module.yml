# 工具面收窄 —— 常驻核心集 + tool_search 按需解锁。
#
# 为什么：工具面实测 **156 个工具、描述合计 46894 字符（约 12K token）**，每个请求都付。
# 收窄到核心集后只剩十来个，其余按需解锁。
#
# `tool-visibility` 声明目录与 SDK 正文的呈现、执行闸和发现来源。
# 常驻集只在这里写一次；首轮提示由普通注入动作组合。
#
# 解锁的生效时机：声明在每个 model step 前重算，解锁在下一步的模型请求里已经可见。
# `requireMatch: true` 是刻意的，但判据是「名单与装配面整体错位」：常驻名单里的名字
# **一个都不在**当前装配面时才放弃裁剪、暴露完整目录；只缺一两个（提供方被替换或关闭）
# 仍照常收窄，缺项只留一条诊断。解锁名不参与这个判定。
#
# 工具名必须与**实际装配名**一致：本项目 harness 是 `pwsh`、`edit` + `write`；
# `bash` 由平台各自提供——Windows 是本模块声明的 `tool-git-bash` 行（Git Bash，`bash -c`），
# POSIX 是官方持久 bash。替换提供方（如 dsh-ops 的 `ops_bash`）属于部署事实，不写进随包名单：
# 加在部署层模块副本（`$DSH_HOME/.prompt-tool/modules/tool-surface/module.yml`）的 allow 即可；
# 没装该插件的部署里这个名字不存在，不产生任何影响。
#
# 停用即回滚：本模块在 config.yml 的 enabled 里删掉即可，重启后工具面完全恢复。

id: tool-surface
name: 工具面收窄（核心文件与任务集）
version: 2.0.0
engineCompat: ">=0.7.2"
description: 把工具面收窄到常驻核心集（bash/pwsh/read/write/edit/glob/grep/todo_write/skill_search/skill_load/tool_search），其余由 tool_search 按需解锁；解锁名从持久调用记录（顶层 tool/call 或 PTC tool/ptc-dispatch）参数回收，跨请求与压缩保留。
meta:
  source: manual
modules:
  - rule-engine
  - tool-search
  # Windows Git Bash 适配行：以 `bash` 之名注册工具、实际执行 Git Bash。
  # 不声明 layerSettings 覆盖 toolGitBashEnabled：能力卡默认就是 true，写出来只会让本模块
  # 覆盖全局开关（内置模块只声明 rules/modules 的声明面契约）。
  - tool-git-bash
order: 7
rules:
  - id: tool-surface-resident
    name: 工具面收窄（核心文件与任务集）
    enabled: true
    then:
      - id: narrow-tools
        kind: tool-visibility
        allow:
          - pwsh
          - read
          - write
          - edit
          - glob
          - grep
          - todo_write
          - skill_search
          - skill_load
          - tool_search
          # 平台各自的 bash 名；替换提供方（如 ops_bash）由部署层名单登记，随包名单只写官方名。
          - bash
        discovery: { kind: tools }
        requireMatch: true
      - if:
          count:
            of: user-message
            max: 1
        then:
          - id: discovery-notice
            kind: inject-text
            config:
              layer: pre-step
              strategy: placeholder
              fill: tool-catalog
              position: after-all
              dedupe: session
              text: 常驻工具：{{RESIDENT_TOOLS}}。缺少所需工具时，先用 {{DISCOVERY_TOOL}} 搜索；要用某个工具，先以 {"toolNames":["<工具名>"]} 解锁——解锁从下一次请求起生效，之后才可调用。
              params:
                action: narrow-tools
