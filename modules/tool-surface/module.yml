# 工具面收窄 —— 常驻核心集 + tool_search 按需解锁。
#
# 为什么：工具面实测 **156 个工具、描述合计 46894 字符（约 12K token）**，每个请求都付。
# 收窄到核心集后只剩十来个，其余按需解锁。
#
# `tool-visibility` 声明目录与 SDK 正文的呈现、执行闸和发现来源。
# 常驻集只在这里写一次；首轮提示由普通注入动作组合。
#
# 解锁的生效时机：声明在每个 model step 前重算，解锁在下一步的模型请求里已经可见。
# `requireMatch: true` 是刻意的：任一常驻工具缺失（或模型解锁了不存在的名字）就放弃裁剪、
# 暴露完整目录——收窄错了会让当前工作流调不到工具，比多花上下文严重。
#
# 工具名必须与**实际装配名**一致：本项目 harness 是 `pwsh`、`edit` + `write`；
# `bash` 由平台各自提供——Windows 是本模块声明的 `tool-git-bash` 行（Git Bash，`bash -c`），
# POSIX 是官方持久 bash。写错名字会触发 requireMatch 的 fail-open，表现为「收窄没生效」。
#
# 停用即回滚：本模块在 config.yml 的 enabled 里删掉即可，重启后工具面完全恢复。

id: tool-surface
name: 工具面收窄（核心文件与任务集）
version: 2.0.0
engineCompat: ">=0.7.2"
description: 把工具面收窄到常驻核心集（bash/pwsh/read/write/edit/glob/grep/todo_write/skill_search/skill_load/tool_search），其余由 tool_search 按需解锁；解锁名从持久调用记录（顶层 tool/call 或 PTC tool/ptc-dispatch）参数回收，跨请求与压缩保留。
meta:
  source: manual
modules:
  - rule-engine
  - tool-search
  # Windows Git Bash 适配行：以 `bash` 之名注册工具、实际执行 Git Bash。
  # 不声明 layerSettings 覆盖 toolGitBashEnabled：能力卡默认就是 true，写出来只会让本模块
  # 覆盖全局开关（内置模块只声明 rules/modules 的声明面契约）。
  - tool-git-bash
order: 7
rules:
  - id: tool-surface-resident
    name: 工具面收窄（核心文件与任务集）
    enabled: true
    then:
      - id: narrow-tools
        kind: tool-visibility
        allow:
          - pwsh
          - read
          - write
          - edit
          - glob
          - grep
          - todo_write
          - skill_search
          - skill_load
          - tool_search
          # 平台各自的 bash 名：装配里没有提供方时这里就是缺失名，收窄整体失效。
          - bash
        discovery: { kind: tools }
        requireMatch: true
      - if:
          count:
            of: user-message
            max: 1
        then:
          - id: discovery-notice
            kind: inject-text
            config:
              layer: pre-step
              strategy: placeholder
              fill: tool-catalog
              position: after-all
              dedupe: session
              text: 常驻工具：{{RESIDENT_TOOLS}}。缺少所需工具时，先用 {{DISCOVERY_TOOL}} 搜索并解锁。
              params:
                action: narrow-tools
