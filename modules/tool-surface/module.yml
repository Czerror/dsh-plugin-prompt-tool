id: tool-surface
name: 工具面收窄（核心文件与任务集）
version: 2.0.0
engineCompat: ">=0.7.2"
description: 把工具面收窄到常驻核心集（官方核心工具 + dsh-ops 的全量替换名，含文件/文档/PTC API 名），其余由 tool_search 按需解锁；解锁名从持久调用记录（顶层 tool/call 或 PTC tool/ptc-dispatch）参数回收，跨请求与压缩保留。
meta:
  source: manual
modules:
  - rule-engine
  - tool-search
  # Windows Git Bash 适配行：以 `bash` 之名注册工具、实际执行 Git Bash。
  # 不声明 layerSettings 覆盖 toolGitBashEnabled：能力卡默认就是 true，写出来只会让本模块
  # 覆盖全局开关（内置模块只声明 rules/modules 的声明面契约）。
  - tool-git-bash
order: 7
rules:
  - id: tool-surface-resident
    name: 工具面收窄（核心文件与任务集）
    enabled: true
    then:
      - id: narrow-tools
        kind: tool-visibility
        allow:
          - pwsh
          - read
          - write
          - edit
          - glob
          - grep
          - todo_write
          - skill_search
          - skill_load
          - tool_search
          # 平台各自的 bash 名，以及 dsh-ops 会替换官方工具、按需发布的全部公开名；
          # 没装该插件的部署里 ops_* 缺席，惰性缺项不影响收窄。
          - bash
          - ops_bash
          - ops_read_files
          - ops_inspect_local_file
          - ops_glob
          - ops_grep
          - ops_result
          - ops_replace
          - ops_write_file
          - ops_edit_file
          - ops_diff
          - ops_stat
          - ops_copy
          - ops_move
          - ops_remove
          - ops_read_table
          - ops_read_docx
          - ops_read_pdf
          - ops_batch
          - ops_load_sdk
          - ops_discover_tools
          - ops_status
        discovery: { kind: tools }
        requireMatch: true
      - if:
          count:
            of: user-message
            max: 1
        then:
          - id: discovery-notice
            kind: inject-text
            config:
              layer: pre-step
              strategy: placeholder
              fill: tool-catalog
              position: after-all
              dedupe: session
              text: 常驻工具：{{RESIDENT_TOOLS}}。{{DISCOVERY_TOOL}} 的 query 只发现工具；精确 toolNames 解锁从下一次模型请求起生效。工具就绪以更新后的工具声明（PTC 为 tools:sdk）包含所需工具为准；搜索命中或解锁回执尚不代表可调用，当前未声明也不代表不存在。工具操作完成以实际调用结果与任务所需证据为准。
              params:
                action: narrow-tools
