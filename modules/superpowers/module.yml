# Superpowers 引导 —— 技能优先（上游 obra/superpowers v7.0.0 的 DSH bootstrap）。
#
# 上游用 SessionStart hook 注入 using-superpowers 技能；DSH 没有该 hook 通道，
# 本模块把引导放进常驻 system-section，技能正文仍由 $DSH_HOME/skills 提供。
#
# 只进主会话：上游 using-superpowers 自带 <SUBAGENT-STOP>，这里用 scope 门实现。
# 与 ponytail 的冲突：用户指令优先；要消歧就在工作台停用一个，停用即回滚。

id: superpowers
name: Superpowers 技能优先引导（bootstrap）
version: 1.1.0
engineCompat: ">=0.4.2"
description: 常驻注入 superpowers 的启动引导（上游 using-superpowers 的 DSH 化改写）：先查技能再动手，附流程优先级、常见路由与红旗。技能正文留在技能库，本模块不分发技能文件。
meta:
  source: manual
modules:
  - rule-engine
order: 8
rules:
  - id: superpowers-bootstrap
    name: Superpowers 引导（常驻）
    enabled: true
    if:
      scope:
        audience: main
    layer: system-section
    then:
      - id: inject
        kind: inject-text
        config:
          id: superpowers-bootstrap
          strategy: static
          layer: system-section
          order: 210
          text: |-
            # Superpowers

            **技能优先**：任何回答或动作之前，先查有没有对应技能。

            ## 规则

            - **先查再动手**：澄清提问、翻代码、看文件之前，先 `skill_search` 或 `skill_load`。路由表里有名字的直接加载；没有就用技能名或描述里的原词搜，一次一两个。堆同义词会把结果搜空。
            - **执行方式**：宣布「Using <skill> to <目的>」后开始，检查清单逐条建 todo。
            - **不适用就说明理由**：载入后确认不匹配，说明原因再换路。
            - **优先级**：用户指令（AGENTS.md、当轮吩咐）> 技能 > 默认行为。

            ## 优先级与路由

            多个技能命中时，流程技能先跑（如 `brainstorming`、`systematic-debugging`），实现或领域技能随后。

            进入计划模式或写计划之前，如果还没 brainstorm，先用 `brainstorming`。

            | 任务信号 | 先加载 |
            |---|---|
            | 要做新功能 / 不确定需求 | `brainstorming` |
            | 修 bug / 测试失败 / 行为异常 | `systematic-debugging` |
            | 需求已定，准备动手 | `writing-plans` |
            | 要改实现代码 | `test-driven-development` |
            | 已有计划，准备执行 | 默认 `subagent-driven-development`；内联执行或没有子代理工具时用 `executing-plans` |
            | 需要隔离工作区 | `using-git-worktrees` |
            | 多个独立任务 / 失败要并行 | `dispatching-parallel-agents` |
            | 实现完成，准备声称成功 | `verification-before-completion`；要核对需求时 `requesting-code-review` |
            | 收到评审意见 | `receiving-code-review` |
            | 准备合并 / 收尾 | `finishing-a-development-branch` |

            表里没有的主题，用技能名或描述原词搜一次；没命中就说明这个缺口，按默认流程继续。已知精确名时直接 `skill_load`。

            本 harness 的工具名映射、技能目录与会话存储见 `using-superpowers` 技能的 `references/dsh-tools.md`。

            ## 红旗

            出现这些念头，先停下查技能：

            | 念头 | 事实 |
            |---|---|
            | 「这只是个简单问题」 | 提问也是任务。 |
            | 「我先多了解上下文 / 翻一眼代码」 | 技能先于澄清和探索。 |
            | 「我记得这个技能」 | 技能会变，读当前正文。 |
            | 「这个技能太重 / 不需要」 | 存在就用。 |
            | 「我先做这一件事」 | 做任何事之前先查。 |
