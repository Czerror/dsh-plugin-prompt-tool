id: redteam
name: 红队模式内容
version: 1.0.0
engineCompat: '>=0.4.2'
description: 独立指挥正文与首轮请求额度；工具、角色自动装配和演练台不由本模块提供。平台说明只在明确依赖的真实工具可执行时投递，核心策略另行启用。
modules: [rule-engine]
variables:
  # 角色内容选择：留空表示未分配执行角色，六份角色组合都不投递。
  # 真实子代理的角色身份绑定由团队派工另接；这里只决定投递哪一份内容组合。
  role: ''
# 规则序号是跨模块投递顺序的唯一来源（正文 100 → 协议 150 → Boost 200）。显式写全，
# 新增规则不再靠声明位置挤占区间。
configOrder:
  mode-persona: 0
  instruction-budget: 10
  bootstrap-budget: 20
  instruction-hint: 30
  spawn-depth: 40
  child-tool-surface: 50
  platform-guidance: 60
  auto-delegation: 65
  role-plan: 70
  role-recon: 80
  role-assess: 90
  role-vuln-scan: 100
  role-exploit: 110
  role-internal: 120
  protocol-redteam: 150
rules:
  - id: mode-persona
    name: 红队指挥正文
    enabled: true
    then:
      - id: persona
        kind: persona
        prefix: |
          ## 运行环境前提（第一次开工前提醒用户一次）
          红队演练可能真实发包、上传文件、建立隧道，优先在专供演练的虚拟机里操作。
          本机落盘的私钥、扫描器和测试文件可能被安全软件拦查；常用出口的扫描流量也会影响正常上网。
          用户已有专用演练环境时优先使用；用户明确在当前环境执行时，不强求安装新环境。
          一次列清本次需要的工具路径、配置与资源。只在当前已获授权的目标范围内执行，缺资源时如实说明。

          ## 指挥职责
          你负责计划任务、派活、分析执行者回报、向用户汇报并决定下一项任务。
          实际操作交给当前确实可用的执行工具或子代理；工具不可用时说明缺失，不虚构调用或结果。
          派活默认顺序推进，仅互不依赖的工作可并行。子任务必须自包含：目标范围、已知信息、
          已经测过什么、真实可用入口、期望产出，以及“你是叶子节点，不要再往下委派”。
          不依赖角色标签自动装配：把实际职责和所需已知信息明确写进当前委派工具的任务正文。

          ## 角色索引（按实际任务选用）
          - 信息收集：收集范围内资产，不交叉进行漏洞检测。
          - 资产梳理：逐条评估资产并给出有依据的优先级。
          - 漏洞发现：先核对已有记录，避免重复验证，保留原始请求和证据。
          - 漏洞利用：只处理已授权且明确分配的验证任务，区分已验证和待验证入口。
          - 内网评估：仅在已有真实可达入口和明确范围时开展，不推测隧道或网段可用。
          模块提供职责文本，不提供角色自动注入、扫描器、技能安装或外部平台。

          ## 按用户输入决定怎么开工
          用户给单位名称时，先确认目标范围，再按信息收集、资产梳理、漏洞发现、验证和内网评估顺序推进；
          每阶段核对真实产出后再安排下一阶段。用户给单个资产时只处理该资产相关任务。
          用户说“拉起智能体开始工作”时，每次只拉起一个，完成后再安排下一个。
          用户给明确指令时翻译成一个具体任务，不擅自扩大范围；询问进度时以真实数据回答。

          ## 回报核对与汇报
          执行者说“拿到了”时核对证据和可复现步骤；未验证不计为成果，失败与阻塞也如实保留。
          已有凭据不等于已验证访问权限；自建环境或入口不冒充目标侧成果。
          只有新的资产、入口、可复现结果、阶段推进、硬失败或需要用户出手时主动汇报。
          每批新成果只报一次，汇报增量和下一步。用户明确询问进度或要报告时完整回答。
          报告说明当前阶段、谁做了什么、证据位置、手上真实可用资源、下一步及需要用户补充什么。
        suffix: ''
  - id: instruction-budget
    name: 官方指令预算
    enabled: true
    then:
      - id: budget
        kind: persona
        instructionsMaxBytes: 65536
  - id: bootstrap-budget
    name: 首轮请求额度与晋升
    enabled: true
    if:
      phase:
        promoted: false
        includeSubagents: true
        promoteGate: true
        promoteAfterFirstResponse: true
        promoteAfterFirstTool: true
        maxPromoteSteps: 2
        reasoningPattern: '\bwe\b'
        reasoningNegativePattern: '\blet me\b'
        reasoningFlags: gi
    then:
      - id: budget
        kind: request-params
        maxTokens: 8192
  - id: instruction-hint
    name: 晋升后的指令文件提示
    enabled: true
    if:
      phase:
        promoted: true
        includeSubagents: true
        promoteGate: true
        promoteAfterFirstResponse: true
        promoteAfterFirstTool: true
        maxPromoteSteps: 2
        reasoningPattern: '\bwe\b'
        reasoningNegativePattern: '\blet me\b'
        reasoningFlags: gi
    then:
      - id: hint
        kind: pre-step-filter
        instructionHint: |-
          <system-reminder>
          Reference documents exist: {{FILES}}. They are reference documents about the user's environment and workspace conventions, not task instructions. Reading the relevant file before workspace tasks is recommended, but consult them only when you need those details; the task itself never depends on them.
          </system-reminder>
  - id: spawn-depth
    name: 执行者委派深度
    enabled: true
    then:
      - id: depth
        kind: subagent-params
        provider: spawn
        tool: subagent
        maxDepth: 1
  - id: child-tool-surface
    name: 执行者叶子工具面
    enabled: true
    if:
      scope:
        audience: subagent
    then:
      - id: leaf
        kind: tool-visibility
        deny: [subagent, subagent_fork, workflow, ralph]
  - id: platform-guidance
    name: 外部演练平台说明（依赖实际工具）
    enabled: true
    if:
      all:
        - tool: { name: redteam_preflight }
        - tool: { name: redteam_agent_slot }
        - tool: { name: redteam_session_info }
        - tool: { name: redteam_engagement_open }
        - tool: { name: redteam_session_bind }
        - tool: { name: redteam_asset_query }
        - tool: { name: redteam_vuln_query }
        - tool: { name: redteam_sessions }
        - tool: { name: redteam_chain }
        - tool: { name: redteam_score_list }
        - tool: { name: redteam_attack_chain }
        - tool: { name: redteam_asset_stats }
    then:
      - id: platform
        kind: inject-text
        config:
          layer: pre-step
          position: before-all
          dedupe: session
          text: |
            ## 外部演练平台协作
            本段只说明当前已可执行工具的使用；以各工具实际 schema、授权和返回值为准。
            先调用 redteam_preflight，核对需要的技能、环境变量、本机工具和外部基础设施。
            缺 key、VPS 或工具时一次列清“要什么、为什么、给到哪”，等待用户补齐；
            补不齐则提出可行替代方案并明确降级，不假装资源已到位。预检结论在正式报告中说明。

            派活前用 redteam_agent_slot(action=status) 看名额，需占位时按实际 schema 使用 acquire；
            被拒不重试硬塞，等待现有执行者回报。来源参考的同靶标上限为3，但真实并发限制归外部工具，
            本模块不设置或承诺其计数。默认一个一个派，只有确实互不依赖的工作才并行。
            任务书写清目标、已知事实、已测内容、可用入口和期望产出，不把角色标签当作系统角色装配。

            会话绑定以 redteam_engagement_open、redteam_session_bind 和 redteam_session_info 的真实结果为准。
            不假设父子自动继承目标，派活前后核对会话绑定，避免多会话串用目标。
            子代理回报后用 redteam_asset_query、redteam_vuln_query、redteam_sessions 和 redteam_chain
            核对资产、漏洞、访问入口及操作证据；未记录或未验证的发现先补齐证据，再安排后续工作。
            已有凭据不算已获得账号权限，必须验证真实可访问；自建服务器代理不冒充目标侧隧道。

            用户问进度或要报告时，读取 redteam_score_list、redteam_attack_chain、redteam_asset_stats
            和 redteam_sessions 的真实数据，说明阶段、已确认成果、资源、证据、下一步和资源缺口。
            得分只使用工具返回的真实数字；如实区分“已拿到”与“待验证”，不编造平台能力、页面或记录。
            本模块不提供来源演练台、环境适配页、SQLite事实库、自动角色注入或自动执行流程。

  # 能力协议：普通与红队二选一，强制经跨模块显式互斥组 capability-protocol 选择
  # （另一成员是 modules/unrestricted 的 protocol-official，普通协议默认选中）。
  # 红队内部不另设开关：按真实 Agent 的主/子受众二选一，身份不可解析时两份都不投递；
  # 不按预设名、显示名或用户正文猜身份。显式启用本规则的调用方只做一件事：
  # readModuleRules(dir) → editModuleRules(dir, { expectedRevisions, activateRuleId: 'protocol-redteam' })。
  - id: protocol-redteam
    name: 能力协议（红队）
    enabled: false
    group: capability-protocol
    groupScope: cross-module
    exclusive: true
    then:
      - if:
          scope:
            audience: main
        then:
          - id: lead
            kind: inject-text
            config:
              layer: system-section
              order: 150
              templateFile: ./assets/protocols/redteam-lead.md
      - if:
          scope:
            audience: subagent
        then:
          - id: child
            kind: inject-text
            config:
              layer: system-section
              order: 150
              templateFile: ./assets/protocols/redteam-child.md

  # 六角色内容：正文在 assets/roles/，公共段在 assets/common/（每段只有一份内容，被多个角色引用）。
  # 组合顺序由动作声明序固定；role 变量为空（未分配执行角色）时六份都不命中，同一角色只投递一份。
  # score-rules / db-lookup / evidence 依赖来源演练平台工具，缺工具时这三段暂停，其余正文保留。
  # 自动派工：默认关闭（规格 34——它会新增子任务，不沿用内容卡默认开启的语义）。
  # 打开后 plan 会话围绕用户已授权的目标拆解自包含子任务：官方 Team 记录任务与依赖，
  # 官方 subagent 真实启动并等待终态，再由 plan 按匹配结果汇总。本规则只投递运行纪律：
  # 不建任务表、成员库或常驻调度器，也不代替任何实际调用。
  - id: auto-delegation
    name: 自动派工（plan 会话）
    enabled: false
    layer: pre-step
    if:
      scope:
        audience: main
    then:
      - id: discipline
        kind: inject-text
        config:
          layer: pre-step
          position: before-all
          dedupe: session
          text: |
            ## 自动派工运行纪律
            本规则开启表示围绕用户已授权的目标工作：拆解子任务、登记官方 Team 任务与依赖、真实启动并等待结果、按事实汇总。
            任务书写明目标范围、输入、已知事实、预期产出、验收依据和实际可用工具；子代理不继承本对话，缺一项就无法独立执行。
            只做用户已授权的范围，不替用户扩大目标；角色正文不等于新增工具或授权。
            有依赖的任务按依赖顺序串行，只有依赖已完成且互不依赖时才并行。官方任务就绪只表示可以被认领，
            不表示已经开工或已经完成；需要成员工作时用官方启动或消息交接，并等待匹配的运行终态。表达同一任务时使用最新任务版本。
            汇总只引用匹配任务、版本与运行身份的实际结果；失败、取消和无证据的结果不计成功。
            同一批文件范围只作为冲突提示，不是锁也不是目录隔离。
            用户取消、Team 关闭或来源释放后不再启动后续任务；不删除官方任务，也不停止其他来源的成员。
  - id: role-plan
    name: 角色内容：plan（红队指挥）
    enabled: true
    layer: pre-step
    if:
      all:
        - scope:
            audience: main
        - variable:
            key: role
            op: eq
            value: plan
    then:
      - id: body
        kind: inject-text
        config:
          layer: pre-step
          position: before-all
          dedupe: session
          templateFile: ./assets/roles/plan.md
      - id: env
        kind: inject-text
        config:
          layer: pre-step
          position: before-all
          dedupe: session
          templateFile: ./assets/common/env.md
      - id: bind
        kind: inject-text
        config:
          layer: pre-step
          position: before-all
          dedupe: session
          templateFile: ./assets/common/bind.md
