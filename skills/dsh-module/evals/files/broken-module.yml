# 我的规则模块（示例：待审查）
id: my-rules
name: 我的规则
version: 1.0.0
engineCompat: ">=0.4.2"
description: 常驻规则 + 两档强度
modules:
  - prompt-config-engine
params:
  instructionHint: true
  strReplaceEditorMaxOutputChars: 8000
variables:
  WHO: ""
rules:
  - id: rules-main
    name: 常驻规则
    layer: system-section
    if:
      scope:
        audience: main
    when:
      phase:
        promoted: true
    do:
      - id: inject
        kind: inject-text
        config:
          layer: system-section
          strategy: static
          order: 190
          role: assistant
          audience: main
          text: |-
            规则正文……
  - id: level-full
    name: 档位：full
    enabled: true
    layer: system-section
    group: level
    exclusive: true
    then:
      - id: inject
        kind: inject-text
        config:
          layer: system-section
          strategy: static
          order: 200
          text: "档位：full"
  - id: level-lite
    name: 档位：lite
    enabled: true
    layer: system-section
    group: level
    exclusive: true
    then:
      - id: inject
        kind: inject-text
        config:
          layer: system-section
          strategy: static
          order: 201
          text: "档位：lite"
