# =============================================================================
# dsh-plugin-prompt-tool — 全参数 preset.yml 模板
# -----------------------------------------------------------------------------
# 本文件是【配置参数齐全、逐项注释】的预设模板，复制到
#   ~/.dsh/.agent-presets/<你的预设名>/preset.yml
# 或 preset/<预设名>/preset.yml 即可作为自定义预设起点。
# 完整可用示例见 preset/anchored/preset.yml（含真实 prompt 文本）。
#
# 默认值体系（职责不重叠）：
#   params        → 引擎行为参数（锚定/引导/PTC/门控/模型/工具），经参数桥落位组合行；
#                    UI 可管理（PARAM_KEYS），优先级最高
#   moduleConfigs → 行级 config 直写通道（参数桥未覆盖的键：超时/环境白名单/ST 导入等），
#                    不锁定覆盖 UI 可管理参数
#   promptConfigs → 注入提示词配置（策略/层/位置/时机），与目录、settings 三源合并
# =============================================================================

# ── 预设元数据 ──────────────────────────────────────────────────────────────
id: my-preset                    # 预设唯一 id（UI 切换值=目录名，id 兼容兜底）
name: 我的预设                    # 预设显示名（UI 预设切换器展示）
version: 1.0.0                   # 预设版本（引擎兼容性诊断用）
engineCompat: ">=0.4.2"          # 插件引擎最低版本约束

meta:
  name: prompt-tool              # 归属插件
  description: 一句话描述这个预设。  # 预设说明
  order: 5                       # 预设列表排序（数字小在前）

# ── 内容：preset.md / AGENTS.md 文本（占位，替换为你自己的提示词）────────────
content:
  # 系统提示词（写入生成目录 preset.md；支持官方 {{variable}} 渲染）。
  # 完整示例见 preset/anchored/preset.yml 的 content.presetText。
  presetText: >
    You are a helpful software assistant.

    Answer requests directly in the user's language.

  # 项目级规范（写入生成目录 AGENTS.md）。
  agentsText: |
    # 语言行为规范

    1. 思维链使用简体中文。
    2. 回答内容使用简体中文。

# ── model / subagentModel：模型参数（顶层段，官方 agent-default-model 同构）──
# 模型参数独立于 params（引擎行为参数）——对齐官方范式（模型设置独立 namespace）。
# 新写/编辑一律用本顶层段；params 扁平键（modelProvider 等）仅旧布局读取兼容，
# 保存时 savePresetParams 自动迁移（写顶层段 + 清理扁平键），无需手工维护。
# 读取：顶层段优先展平进 params 扁平键（modelProvider 等），扁平旧键兜底；
# 写入：savePresetParams 写顶层段并清理 params 旧扁平键（保存即迁移）。
model:                           # 主对话模型（新会话默认；空=继承宿主 agent-default-model）
  provider: ""                   # 模型服务商
  name: ""                       # 模型名（空=继承宿主）
  reasoningEffort: ""            # 思维程度（''=不设置；off/low/high/max）
  temperature: ""                # 采样温度（''=不设置）
  maxTokens: ""                  # 输出上限（''=不设置）
subagentModel:                   # 子代理模型（固定路由；空=继承主会话）
  provider: ""                   # 子代理模型服务商（tool-subagent agentOptions.provider）
  name: ""                       # 子代理模型名（空=继承主会话）
  reasoningEffort: ""            # 子代理思维程度（''=不设置）
  temperature: ""                # 子代理采样温度（''=不设置）
  maxTokens: ""                  # 子代理输出上限（''=不设置）

# ── params：引擎行为参数（全部可选，缺省 = 模板/引擎默认）────────────────────
params:
  # ── 锚定（首轮任务类型判定）──
  firstTurnAnchor: true          # true=首轮启用任务锚定（判定 build/fix/deep）
  firstTurnCustom: false         # true=用 firstTurnText 替代内置锚定句
  firstTurnText: ""              # 自定义锚定句（firstTurnCustom=true 时生效）
  firstTurnWord: ""              # 锚定确认词（custom-fallback 命中词；空 = 自动从锚句派生，非空 = 显式覆盖）
  firstTurnBuild: "Start your reasoning with the exact sentence: We need to build it directly and verify it."
  firstTurnInspect: "Start your reasoning with the exact sentence: We need to inspect the code first."
  firstTurnDeep: "Start your reasoning with the exact sentence: Let me think through the design before changing anything."

  # ── 引导（每轮路由引导）──
  guideCustom: false             # true=用 guideText 替代内置引导
  guideText: ""                  # 自定义引导文本（guideCustom=true 时生效）
  # guideEnabled: true           # 每轮引导独立开关；不声明 = 跟随 firstTurnAnchor（关锚定 = 关引导）
  # 复杂任务判定 fallback 复用上方 complexPattern（引导与锚定共用分类器）。
  guideWeak: "Router: classify this task (build or fix) now, then adopt the matching style — build: direct production; fix: inspect-first. Think deeply first, then commit and act."
  guideDeep: "Router: classify this task (build or fix) now, then adopt the matching style — build: direct production; fix: inspect-first. Think deeply about the architecture, edge cases, and integration points. Do not spend reasoning on the environment or tooling. Produce when your information is complete. End each reasoning block with a decision or an information need."
  buildPattern: "开发|创建|写一个|生成|从零|做一个|构建|新项目|搭建|实现|做出|上线|落地|脚本|工具|应用|build|create|develop|generate|implement|make a|new project"
  complexPattern: "架构|重构|设计|系统|全面|深度|迁移|兼容|审查|architecture|refactor|comprehensive|design|system|migrate|review"

  # ── PTC 模式 / 门控 ──
  # 晋升门控与状态机参数（参数桥扁平键，直达 tool-bootstrap / context-gate /
  # code-presentation 模块行 config；缺省 = 引擎默认，参数桥优先于 moduleConfigs）：
  usePtcMode: false              # false=默认关闭；true=晋升后 Code Mode (PTC) 呈现（code-presentation 行，opt-in）
  bootstrapMaxTokens: 0          # 首轮工具目录引导的 maxTokens 上限；0=不封顶
  injectPrompt: true             # true=锚定确认后注入 preset.md 一次（确认词自动从锚句派生）
  allowKinds: "[skill-invocation, near-anchor, router-guide]"  # 注入 kind 白名单（context-gate 门控；不声明 = 不过滤，显式空数组 = 全拦注入，危险）
  # promoteGate: false            # 门控晋升：首段 reasoning minimal-like + 工具调用才晋升
  # promoteAfterFirstResponse: false  # 无工具首响应 / 首轮 turn/end 即晋升
  # maxPromoteSteps: 4            # 门控回退：步数达上限强制晋升
  # bootstrapTools: [bash, str_replace_editor]  # 首轮工具窄化集；清空 [] = 零工具模式（首请求空工具面产生最深
  #                                              # "we" 轨迹，assistant/message 后晋升；compaction 回退自动补 shell）
  # compactionTools: []           # 压缩后恢复集（模型中途继续工作的核心工具）
  # personaSectionsOnly: false    # phase-1 提示词段只留 persona
  # workspaceLine: false          # 晋升后 persona 附加工作目录行
  # phase1FirstCallInstruction: ""  # phase-1 persona 追加的首次调用指令行
  # messageSources: []            # context-gate phase-1 消息源白名单（空 = 不启用）
  # deferredSources: []           # 晋升后延迟注入的 source kind
  # deferredGraceSteps: 0         # 延迟注入宽限步数
  # instructionHint: false        # 晋升后 agent-instructions 全文 → 一次性 hint

  # ── 锚定/深思可选模块（上游 dsh-anchored-standard 移植，全部 opt-in）──
  # 对应 library 行默认 enabled: false（挂载即禁用，行为不变）；UI 开关打开
  # （或本段置 true）即写行 config.enabled: true 生效。前提：modules 已挂对应行。
  # anchorTurn: false             # 前置锚定轮（anchor-turn 行）：用户首条真实消息前 prepend 合成锚定轮，
  #                                # 配合 bootstrapTools: [] = 空工具面锚定（真实消息顺延一轮，届时已晋升）
  # anchorTurnText: ""            # 锚定轮自定义文本（如「你是谁」）；空 = 引擎默认 "This round is a test…"
  # deliberationGate: false       # 轨迹深度门（deliberation-gate 行）：首工具调用前流式深思 < 下限时
  #                                # deny 一次（规划式提示，非工具失败）；retry 带强制深思进历史
  # deliberationMinChars: 400     # 深思下限（字符数）；0 = 回落行默认 400；minChars: 0 禁用由行配置直写
  # deliberationMaxGatesPerTurn: 1  # 每轮最大 deny 次数；0 = 回落行默认 1
  # cotDrip: false                # 深思维持节拍（cot-drip 行）：每 N 次工具结果滴入一条 "We…" 重申提醒
  #                                # （additionalContexts，永不阻塞）；长工具循环防深思衰减
  # cotDripEvery: 4               # 节拍间隔（工具结果数）；0 = 回落行默认 4
  # cotDripMaxPerTurn: 1          # 每轮最大提醒条数；0 = 回落行默认 1

  # ── 工具集（子代理 toolFilter；主对话 tool-filter 模块共用同一扁平键）──
  toolFilterAllow: []            # 子代理工具白名单（数组或逗号/空格字符串；空=不过滤）
  toolFilterDeny: []             # 子代理工具黑名单（数组或逗号/空格字符串；空=不过滤）

  # ── 委派深度 ──
  maxDepth: ""                   # 子代理递归深度：0=禁止委派 / provider-managed / 正整数；空=官方默认

  # ── 渐进披露（可选，tool-bootstrap stages 模式；不声明 = 两相窄化）──
  # stages:                        # 阶段定义 [{name, tools}]；声明即激活多级阶段窄化
  #   - { name: 了解, tools: [read, glob, grep] }
  #   - { name: 开发, tools: [write, edit] }
  #   - { name: 验证, tools: [pwsh, bash] }
  # stagePreUnlock: 1              # 预放档数（调用预放工具 = 直达其档；0 = 删键回落默认 1）
  # stageAdvanceTool: phase_advance  # 阶段推进工具名
  # stageAdvanceDescription: ""    # 阶段推进工具描述
  # stageSectionTemplate: ""       # 阶段状态 section 模板（{{stage}}/{{stageName}}/{{unlocked}}/{{total}}；空=不注入）
# ── promptConfigs：注入提示词配置（三源合并：默认 < 目录 < 本段）──────────────
# 每条配置的通用字段（除 id 外全部可选，缺省见注释）：
# 每条配置的通用字段（除 id 外全部可选，缺省见注释）：
#   id             唯一 id，必填；同名覆盖默认配置
#   name           显示名，默认等于 id（UI 使用）
#   enabled        总开关，默认 true
#   layer          注入层级：pre-step（默认）/ system-section / runtime-context /
#                  agent-request / llm-stream / tool-pipeline
#   strategy       内容策略：static（默认）/ first-turn-anchor / guide-auto /
#                  custom-fallback / world-book / placeholder / instruction-hint
#   position       插入位置（pre-step）：after-user（默认）/ before-all / after-all
#   dedupe         幂等：none（默认）/ session（每会话一次）/ batch（当批去重）
#   promotion      晋升门槛：none（默认）/ main / include-subagents
#   audience       消息受众：缺省=公用（主会话+子代理都注入）；main=仅主会话；
#                  subagent=仅子代理（委派子代理专用）
#   modelScope     模型范围：all（默认）/ pro / flash
#   configKind     排序类型：ordered（按 order 升序，默认）/ anchor（固定文件序排最前）
#   order          同层排序权重（同时决定 merged 拼接顺序），默认 0
#   role           注入消息角色：user（默认）/ assistant
#   mergeMode      同位置多条：separate（默认，独立消息）/ merged（拼接为一条）
#   group          互斥组名：同 group 且 exclusive=true 时只执行排序后第一个 enabled
#   exclusive      互斥开关（需配合 group），默认 false
#   sourceKind     注入消息 source.kind，默认等于 id
#   form           source.form：notice（默认）/ hint
#   summary        source.summary，默认空
#   templateFile   外部 yml/json/纯文本内容模板（text 优先）
#   identity       持久幂等匹配字段，默认 {field: plugin, value: id}
#   text / texts   注入内容（都写时 text 在前 texts 追加；空 = 不注入）
#   variables      模板变量（配置级），{{key}} 插值优先于预设 variables
#   params         策略参数（static 无；各策略见下方对应层的参数说明）
# 插值：{{key}} = 配置/预设 variables > 会话变量（session_var 工具）> 运行时宏
# （lastusermessage 等）> 动态宏（roll/random/pick/time/date）> 内置
# （DSH_HOME/WORKSPACE/CWD）> 字面保留。
# agent-request / llm-stream / tool-pipeline 的参数说明与示例见本段下方各块。
# 默认四条（子代理默认全部放行/跟随；如需仅主会话/仅子代理，显式写
# audience: main / subagent 即可）：
promptConfigs:
  - id: near-anchor              # 首句任务锚点（首轮注入一次）
    name: 首句锚点
    enabled: true
    strategy: first-turn-anchor
    layer: pre-step
    configKind: ordered
    order: 0
    role: user
    position: after-user
    dedupe: session
    promotion: none
  - id: router-guide             # 每轮路由引导（仅快速模型档）
    name: 每轮引导
    enabled: true
    strategy: guide-auto
    layer: pre-step
    configKind: ordered
    order: 10
    role: user
    position: after-user
    dedupe: batch
    promotion: main
    modelScope: flash
  - id: prompt-injector          # 锚定确认后注入 preset.md 一次
    name: preset.md 注入
    enabled: true
    strategy: custom-fallback
    layer: pre-step
    configKind: ordered
    order: 20
    role: user
    position: before-all
    dedupe: session
    promotion: main
    sourceKind: plugin
  - id: instruction-hint         # 指令文件存在性提示（子代理晋升后跟随）
    name: 指令文件提示
    enabled: true
    strategy: placeholder
    layer: pre-step
    configKind: ordered
    order: 30
    role: user
    position: after-all
    dedupe: session
    promotion: include-subagents
    sourceKind: instruction-hint
    form: hint
    fill: instruction-hint

# ── 策略参数参考（strategy 专用 params，除下方各层注释外）───────────────────
# first-turn-anchor（首轮任务锚点）：
#   useCustom            true=固定使用 text；false=按正则自动选引导句
#   text                自定义锚文本（useCustom=true 时注入；writePreset 从 params.firstTurnText 映射）
#   buildPattern        构建任务正则（命中用 firstTurnBuild）
#   complexPattern      复杂任务正则（命中用 firstTurnDeep）
#   firstTurnBuild      构建引导句 / firstTurnInspect 排查引导句 / firstTurnDeep 复杂设计引导句
# guide-auto（每轮路由引导）：
#   useCustom            true=固定使用 text；false=按任务自动选强弱引导
#   text                自定义引导文本（useCustom=true 时注入）
#   complexPattern      复杂任务正则（fallback 复用锚定分类器；旧 guideComplexPattern 已移除）
#   guideWeak           简单任务自动引导 / guideDeep 复杂任务自动引导
# custom-fallback（自定义锚定词，prompt-injector 晋升确认）：
#   firstTurnWord       锚定确认词（首轮 reasoning 开头命中即注入；空 = 自动从锚句派生确认词集合；ASCII 词边界 / 非 ASCII 直前缀，
#                       锚定匹配经 anchor-match 引擎 prefix 模式）
#   text                注入内容（晋升确认后注入一次）

# ── world-book 策略（世界书条目，SillyTavern character_book 转换落点）───────
# 策略 strategy: world-book，按关键字触发的上下文条目，全部字段与普通配置一致
# （layer / position / order / enabled / dedupe…），关键参数在 params：
#   params.constant       true=常驻注入（不扫描关键字，每轮注入）
#   params.keys           触发关键字数组（命中聊天内容任一即注入；与 secondaryKeys 合并匹配）
#   params.secondaryKeys  次级关键字（与 keys 合并匹配，任一命中即注入）
#   params.caseSensitive  true=关键字区分大小写（默认不区分）
#   params.wholeWords     true=整词匹配（默认子串包含；中文无词边界，对英文生效）
#   正则形态键自动检测：/regex/ 包裹或含正则特殊字符的 keys 按正则匹配（ST 语义，无 use_regex 字段）
#   params.selectiveLogic ST world_info_logic（选择性触发组合逻辑）：
#                         0=主/副键任一命中（默认）/ 3=副键全中才注入 /
#                         1=副键全不中才注入 / 2=至少一个副键未中才注入
# 注入语义：constant=true 恒注入；有 keys 命中才注入；无 keys 且非常驻 = 全局条目
# 每轮注入（对齐 dsh-tavern 语义）。管理入口：模块列表下拉「世界书」过滤
# （完整模块卡片编辑 + 批量启用/禁用）；模型工具（会话中直接维护，写入本段
# promptConfigs）：world_book_list（列出条目）/ world_book_upsert（新增或更新，
# 自定义工具（顶层 customTools 段，tool-config-engine 加载渲染并运行时注册）：
#   声明式定义模型工具：id（文件标识）/ name（模型可见 ^[a-z][a-z0-9_]*$）/
#   description / parameters（dsh-tools schema 形态）/ output.schema / execute：
#   kind 执行器 shell（命令，{{args.x}} 插值，env 白名单）/ http（fetch）/
#   delegate（委托已注册工具）/ fs（read/write/append/list/delete，路径限定工作区）/
#   ask-user（approval 通道）。坏定义引擎跳过并告警；行 requireApproval 可列
#   执行器强制 approval 门。管理入口：模块列表「自定义工具」卡片（JSON 编辑）。
# note 参数可选写入角色卡记忆 .characters/<卡>/memory.md）/ world_book_delete
# （删除条目，note 同）。
# 示例（取消注释即可启用）：
# - id: world-rule
#   name: 世界观规则
#   enabled: true
#   strategy: world-book
#   layer: pre-step
#   position: before-all
#   order: 40
#   text: |
#     魔法系统的核心规则：魔力来自星辉，施法需要手势配合。
#   params:
#     constant: true
# - id: world-trigger
#   name: 触发条目
#   enabled: true
#   strategy: world-book
#   layer: pre-step
#   position: before-all
#   order: 50
#   text: |
#     当对话提到酒馆时注入这段设定。
#   params:
#     keys: [酒馆, 旅店, tavern]

# ── system-section 层参数说明（官方 ctx.systemPrompt.section 静态段）─────────
# 本层是唯一支持官方 {{variable}} 渲染的静态层（缓存友好，静态内容优先放这里），
# 可用参数：
#   order              段内排序，数值小者靠前（多条 system-section 的拼接顺序；
#                      order 参考：-100 身份 / 0 persona / 100-199 工具引导）
#   text               静态文本，支持官方 {{variable}} 渲染
#   templateFile       外部模板文件（相对引擎文件解析，与 text 二选一）
#   variables          文本变量表（text 中 {{KEY}} 的替换值）
#   mergeMode          merged=与同层其他配置按 order 拼接为一条 system prompt
#   params.complete    true=minimal 完整 persona（plan-mode/Flash 路由人设被抑制）；
#                      false=standard 语义——system-section 生效的前提
#   params.sectionName 自定义段名（默认取 id）
# 注意：本层注册即全局，官方 API 无逐 agent / 逐消息概念——subagents /
#       promotion / dedupe / position / modelScope 配置了也不会生效（非配置错误）。
# 示例（取消注释即可启用）：
# - id: identity-section
#   name: 身份段
#   enabled: true
#   strategy: static
#   layer: system-section
#   order: -50
#   text: |
#     你是 {{AGENT_NAME}}，回复前先说明正在做什么。
#   variables:
#     AGENT_NAME: prompt-tool
#   params:
#     complete: false

# ── runtime-context 层参数说明（官方 ctx.systemPrompt.context 动态快照）──────
# 随会话变化的内容放这里（动态文本不要进 system-section）：
#   order / text / templateFile / variables   同 system-section（静态文本只替换 variables）
#   params.contextName                       自定义快照名（默认取 id）
# 两种 strategy：
#   static      按 order 注册，每次会话装配注入
#   placeholder 单条生效（fill: env-facts / skill-catalog / instruction-hint），
#               支持 filler 变量（如 SKILL_COUNT / SKILL_NAMES）
# 注意：本层无逐 agent / 逐消息概念——subagents / promotion / dedupe / modelScope 不生效。
# 示例（取消注释即可启用）：
# - id: workspace-context
#   name: 工作区快照
#   enabled: true
#   strategy: static
#   layer: runtime-context
#   order: 5
#   text: |
#     当前工作区：{{WORKSPACE}}
#   variables:
#     WORKSPACE: /path/to/project

# ── agent-request 层参数说明（官方 agent/request，LlmCallConfig 修改）────────
# 按 order 注册；modelScope / subagents 生效。
#   params.patch   对象，对冻结的 LlmCallConfig 浅合并（默认，安全）
#   params.replace true=整体替换（返回 patch 本身，需提供完整 provider/model 等字段）
# 注意：params.patch 不插值（原样使用）；text / texts 本层不使用。
# 示例（取消注释即可启用）：
# - id: flash-cap
#   name: Flash 档上限
#   enabled: true
#   layer: agent-request
#   modelScope: flash
#   order: 0
#   params:
#     patch:
#       maxTokens: 4096
#       temperature: 0.3

# ── llm-stream 层参数说明（官方 llm/stream 流包装）──────────────────────────
# 按 order 注册；modelScope 生效（subagents 不适用）。
#   params.mode  pass（默认，透传）/ replace（用 text / texts 替代整个模型流，
#                text 为空时透传）
# 注意：text 不插值。
# 示例（取消注释即可启用）：
# - id: fixed-reply
#   name: 固定回复
#   enabled: true
#   layer: llm-stream
#   modelScope: flash
#   order: 0
#   text: 这是固定回复内容。
#   params:
#     mode: replace

# ── tool-pipeline 层参数说明（官方 tools/pre-execute / post-execute）─────────
# 按 order 注册；modelScope / subagents 生效。
#   params.toolNames  逗号分隔工具名白名单；空=全部工具
#   params.preDecision allow（默认）/ deny / ask（tools/pre-execute 判定）
#   params.denyReason  deny 时的原因文本（默认「{name}: denied by prompt config」）
#   params.postAction  accept（默认）/ replace（用 text 替换工具结果）/
#                      block（阻断并反馈 text）
# 注意：text / texts 用于 postAction=replace/block 的反馈内容，不插值。
# 示例（取消注释即可启用）：
# - id: no-web
#   name: 禁用 web 工具
#   enabled: true
#   layer: tool-pipeline
#   modelScope: all
#   order: 0
#   params:
#     toolNames: web_search,web_fetch
#     preDecision: deny
#     denyReason: 本预设禁用 web 工具

# ── modules：引擎行/组模块装配顺序（增删即改装配）───────────────────────────
# 28 个可用模块：context-gate / tool-filter / tool-bootstrap / code-presentation /
# prompt-config-engine / run-code-env / persona / tool-bash / tool-pwsh /
# persistent-shell / custom-bash / tool-fs / tool-fs-search / str-replace-editor /
# bootstrap-filesystem / tool-jobs / skill-filesystem / skill-search / tool-goal /
# planning / compaction / delegation / tool-ask-user / tool-todo / tool-web /
# anchor-turn / deliberation-gate / cot-drip
# 晋升门控三件套：context-gate（注入门控）+ tool-bootstrap（目录相位）+
# code-presentation（PTC 呈现；「只要 PTC」= 只挂本行）。
modules:
  - context-gate                 # 上下文门控（晋升后才放行注入）
  - tool-filter                  # 主对话工具过滤
  - tool-bootstrap               # 工具目录引导
  - code-presentation            # 晋升后 Code Mode (PTC) 呈现
  - prompt-config-engine         # 提示词注入引擎（必需行，勿删）
  - run-code-env                 # 代码运行环境变量注入
  - persona                      # 人设组装
  - tool-bash                    # bash 工具
  - tool-pwsh                    # pwsh 工具
  - persistent-shell             # 持久 shell
  - custom-bash                  # 自定义 bash（超时/输出上限）
  - tool-fs                      # 文件系统工具
  - tool-fs-search               # 文件搜索工具
  - str-replace-editor           # 精确字符串编辑工具
  - bootstrap-filesystem         # 引导期文件系统
  - tool-jobs                    # 任务面板
  - skill-filesystem             # 技能文件系统
  - skill-search                 # 技能搜索
  - tool-goal                    # goal 工具
  - planning                     # 规划
  - compaction                   # 压缩
  - delegation                   # 委派（subagent）
  - tool-ask-user                # 提问工具
  - tool-todo                    # todo 工具
  - tool-web                     # web 搜索
  # - anchor-turn                # 前置锚定轮（上游移植；行默认 enabled: false，开关见 params.anchorTurn）
  # - deliberation-gate          # 轨迹深度门（上游移植；行默认 enabled: false，开关见 params.deliberationGate）
  # - cot-drip                   # 深思维持节拍（上游移植；行默认 enabled: false，开关见 params.cotDrip）

# ── moduleConfigs（可选）：行级 config 直写通道 ──────────────────────────────
# 仅用于参数桥未覆盖的行级 config（ST 导入等直写 tool-web.fetch / tool-filter.deny）。
# 合并优先级：参数桥（params/UI）> moduleConfigs > 行默认；moduleConfigs 不再锁定覆盖
# UI 可管理参数。库行默认值见 engine/compositions/library/*.yml，模板一般无需声明本段。
# 示例（覆盖库行默认的模块 config 时）：
#   moduleConfigs:
#     custom-bash:
#       timeoutMs: 120000
# persona 文本覆盖走 promptConfigs（persona-main / system-section），不写 moduleConfigs.persona。

# ── 清理与上游（可选）───────────────────────────────────────────────────────
legacyCleanup: []                # 历史残留文件清理列表
upstream:
  repo: dsh-anchored-standard    # 上游策略来源仓库
  snapshot: upstream/dsh-anchored-standard  # 内联快照目录
  sync: pnpm sync:anchored       # 快照刷新命令
