# dsh-plugin-prompt-tool — 全参数 module.yml 模板（自动生成）
# 生成来源：scripts/rebuild-module-template.mjs + ENGINE_PARAM_DEFINITIONS + engine/schema.mjs + templates/
# 重建：pnpm rebuild:module-template；检查：pnpm rebuild:module-template -- --check
# 复制到 DSH_HOME/.prompt-tool/modules/<id>/module.yml，id 与目录名保持一致。
# rules 是唯一行为定义：if 判断树 → then 动作数组（另有 else）；提示词正文属于 inject-text 动作。
# 共享设置只内嵌真实配置卡；空层不自动创建 UI 卡或提示词规则。
# 九层是独立官方扩展点，没有插件定义的跨层执行顺序。详见 docs/injection-point-contracts.md。
# 默认不启用锚定或模型增强；下方参考参数全部为注释，按需启用。
# 指令文件正文和指令策略不放在本文件；不得将用户 AGENTS.md/CLAUDE.md 正文复制进来。

id: my-module
name: 我的模块
description: 九层配置与全部共享参数参考；所有示例规则默认关闭。
version: 1.0.0
engineCompat: ">=0.7.2"
modules:
  # 仅启用规则引擎。其他能力保持 opt-in；写入其已登记参数后会自动补齐装配。
  # 可用模块（engine/compositions 下的文件名）：character-tools, filesystem-editor, instruction-hint, persistent-shell-posix, rule-engine, run-code-env, session-var-tools, skill-search, subagent-tool-policy, tool-bash-disabled, tool-config-engine, tool-git-bash, tool-search, world-book-tools
  # 不可写入 modules 的退役名：prompt-config-engine, declared-triggers（写进即 409 rules-migration-required）。
  # 人设使用顶层 persona；不存在 persona、code-presentation、cot-drip 等已撤销模块别名。
  - rule-engine
layerSettings:
  # 唯一共享参数磁盘位置。按下方参考取消所需注释，不要复制旧 params/model/subagentModel 段。
  {}
variables:
  # 模块内容变量；与共享参数、每条规则的 variables 都是独立命名空间。空字符串是合法占位值。
  {}
customTools:
  # 自定义模型工具列表；结构示例见 templates/tools。工具权限和执行器通过既有专用编辑器配置。
  []
rules:
  # 每条规则默认 enabled:false；规则与动作的 id 必填、各自唯一。
  # if 可组合 all/any/not/notAny；then 中动作在同一执行点按数组相对顺序执行，条件只求值一次。
  # 动作级分支写成 { if, then, else } 节点嵌在 then / else 里，可继续嵌套；else 结构上保证必有一支命中。
  # 同模块非空 group 中存在 exclusive:true 时，整组最多一条启用；多启用是编译期拒绝，不按排序选赢家。
  # 注入正文、变量、内容策略、合并和去重均属于 inject-text.config。
  # config.identity 只允许 {field: plugin, value: 唯一值}；templateFile 相对模块 module.yml 且须在模块目录内。
  # guard、complete、suppressRuntimeContext 是固定注册效果：不接受规则级 if，编译器明确拒绝非法组合。
  # 10-pre-step.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-pre-step
    name: 示例：消息批注入
    enabled: false
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-pre-step
          layer: pre-step
          strategy: static
          position: after-user
          dedupe: session
          configKind: ordered
          order: 0
          role: user
          mergeMode: separate
          sourceKind: ""
          form: notice
          summary: ""
          identity:
            field: plugin
            value: example-pre-step
          text: ""
          variables:
            WHO: ""
          params: {}
  # 14-first-turn-anchor.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-first-turn-anchor
    name: 示例：首句锚点
    enabled: false
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-first-turn-anchor
          layer: pre-step
          strategy: first-turn-anchor
          position: after-user
          dedupe: session
          configKind: ordered
          order: 0
          role: user
          mergeMode: separate
          sourceKind: ""
          form: notice
          params:
            useCustom: false
            text: ""
            buildPattern: ""
            complexPattern: ""
            firstTurnBuild: ""
            firstTurnInspect: ""
            firstTurnDeep: ""
  # 15-guide-auto.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-guide-auto
    name: 示例：每轮引导
    enabled: false
    layer: pre-step
    if:
      all:
        - scope:
            modelScope: flash
        - phase:
            promoted: true
            includeSubagents: false
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-guide-auto
          layer: pre-step
          strategy: guide-auto
          position: after-user
          dedupe: batch
          configKind: ordered
          order: 10
          role: user
          mergeMode: separate
          sourceKind: ""
          form: notice
          params:
            useCustom: false
            text: ""
            guideWeak: ""
            guideDeep: ""
            complexMinChars: 120
  # 16-custom-fallback.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-custom-fallback
    name: 示例：自定义锚词兜底注入
    enabled: false
    layer: pre-step
    if:
      all:
        - phase:
            promoted: true
            includeSubagents: false
        - anchor:
            keys: []
            fallbackAfter: 1
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-custom-fallback
          layer: pre-step
          strategy: anchor-notice
          position: before-all
          dedupe: session
          configKind: ordered
          order: 20
          role: user
          mergeMode: separate
          sourceKind: plugin
          form: notice
          params:
            text: ""
            firstTurnWord: ""
  # 18-placeholder-env-facts.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-placeholder
    layer: pre-step
    if:
      phase:
        promoted: true
        includeSubagents: true
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-placeholder
          layer: pre-step
          strategy: placeholder
          fill: env-facts
          position: after-all
          dedupe: session
          text: ""
          params:
            envKeys: DSH_HOME,DSH_WORKSPACE
            limit: 20
            fields: name,description
            providers: ""
            emptyBehavior: skip
            emptyText: 当前没有可用技能。
    enabled: false
  # 20-system-section.yml — system-section 静态层：注册即全局，由 order 与 params.complete / sectionName 控制。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-system-section
    name: 示例：system 静态段
    layer: system-section
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-system-section
          layer: system-section
          strategy: static
          order: -50
          mergeMode: merged
          text: ""
          variables: {}
          params:
            complete: false
            suppressRuntimeContext: false
            sectionName: ""
    enabled: false
  # 30-runtime-context.yml — runtime-context 层：static 按 order 注册，placeholder 单条生效，由 params.contextName 控制。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder。
  - id: example-runtime-context
    layer: runtime-context
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-runtime-context
          layer: runtime-context
          strategy: static
          order: 5
          mergeMode: merged
          text: ""
          params:
            contextName: ""
    enabled: false
  # 40-agent-request.yml — agent-request 层：按 order 注册，params.patch 改写请求配置。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-agent-request
    layer: agent-request
    if:
      scope:
        modelScope: flash
    then:
      - id: request
        kind: request-params
        patch:
          provider: provider-id
          model: model-id
          reasoningEffort: high
          temperature: 0.3
          maxTokens: 4096
          stop:
            - END
        replace: false
        modelScope: all
    enabled: false
  # 50-llm-stream.yml — llm/stream 层：按 order 注册，params.mode = pass | replace。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-llm-stream
    layer: llm-stream
    if:
      scope:
        modelScope: flash
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-llm-stream
          layer: llm-stream
          strategy: static
          order: 0
          text: ""
          params:
            mode: pass
    enabled: false
  # 60-tool-pipeline.yml — 工具链层：只作规则级展示归属（无 inject-text 通道）——工具链的裁决与追加上下文由 decision / append-context 动作承担；subject / match 可选，命中才裁决。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-tool-pipeline
    layer: tool-pipeline
    then:
      - id: before
        kind: decision
        phase: pre
        decision: allow
        toolNames: bash,run_code
        reason: 该工具被提示词配置禁用
      - id: after
        kind: decision
        phase: post
        action: accept
        toolNames: bash,run_code
        text: ""
    enabled: false
  # 61-deny-tools-presentation.yml — 动作自带执行点，顶层 layer 只是展示归属
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：按动作自身能力。
  - id: example-deny-tools
    name: 工具下架（呈现面）
    enabled: false
    then:
      - id: drop-from-assembly
        kind: assembly
        target:
          tools:
            deny:
              - web_search
              - web_fetch
      - id: strip-sdk-text
        kind: sdk-strip
        mask:
          deny:
            - web_search
            - web_fetch
  # 62-guard-deny-tools.yml — 动作自带执行点，顶层 layer 只是展示归属
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：按动作自身能力。
  - id: example-deny-tools-guard
    name: 工具下架（执行层）
    enabled: false
    then:
      - id: deny-at-execution
        kind: guard
        mask:
          deny:
            - web_search
            - web_fetch
        reason: 当前模块不开放联网工具
  # 63-append-context.yml — 工具链层：只作规则级展示归属（无 inject-text 通道）——工具链的裁决与追加上下文由 decision / append-context 动作承担；subject / match 可选，命中才裁决。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-append-context
    name: 工具结果后追加上下文
    enabled: false
    layer: tool-pipeline
    if:
      names:
        allow:
          - web_fetch
    then:
      - id: note-after-tool
        kind: append-context
        mode: context
        text: 网络结果可能已过期；引用它时说明来源与抓取时间。
  # 64-pre-step-filter.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-pre-step-filter
    name: 前置步骤过滤（按插件屏蔽）
    enabled: false
    layer: pre-step
    then:
      - id: block-one-plugin
        kind: pre-step-filter
        blockPlugins:
          - example-plugin
  # 65-turn-stop.yml — agent/turn-stopping 层：命中条件时强制续跑一步；引擎内置续跑上限，不可用配置关闭。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-turn-stop
    name: 未完成时强制续跑
    layer: turn-stop
    if:
      text:
        keys:
          - 接下来我会
          - 稍后继续
          - 待办如下
        subject: assistantText
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-turn-stop
          layer: turn-stop
          strategy: static
          order: 0
          text: |-
            上一轮还没有给出完整交付。请继续把当前任务做完：不要停在中途，
            也不要用「接下来我会…」的计划代替实际执行。
          params: {}
    enabled: false
  # 66-subagent-start.yml — subagent/start 层：命中条件时向该子代理注入上下文。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-subagent-start
    name: 子代理通用守则
    layer: subagent-start
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-subagent-start
          layer: subagent-start
          strategy: static
          order: 0
          text: |-
            开始编辑之前，先确认你改的这条路径在运行时会真的被执行：查调用链，
            或用探针跑一次看它动。找不到证据就继续查，不要凭「看起来像」就动手。
          params: {}
    enabled: false
  # 67-inbox-prepend.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: example-inbox-prepend
    name: 首轮前置一条消息
    enabled: false
    layer: pre-step
    if:
      session:
        type: user/message
        present: false
    then:
      - id: prepend-first-turn
        kind: inbox-prepend
        target: next-turn
        text: 动手之前先读工作区的 AGENTS.md，再决定改哪里。
  # 70-subagent-maintenance.yml — 官方默认层：agent/pre-step 消息批。支持 position / dedupe / promotion / audience / mergeMode 与文本插值。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static, placeholder, first-turn-anchor, guide-auto, anchor-notice, world-book。
  - id: subagent-maintenance
    name: 子代理状态/记忆维护
    enabled: false
    layer: pre-step
    if:
      scope:
        audience: subagent
    then:
      - id: inject
        kind: inject-text
        config:
          id: subagent-maintenance
          layer: pre-step
          strategy: static
          position: after-user
          dedupe: none
          configKind: ordered
          order: 2000
          role: user
          mergeMode: merged
          sourceKind: ""
          form: hint
          summary: ""
          identity:
            field: plugin
            value: subagent-maintenance
          text: |-
            你是本会话的「状态与记忆维护者」，与创作类子代理职责互补：
            - 状态（本会话临时，模板变量注入用）：观察互动中明确的角色状态变化
              （心情、态度、接受度等），用 session_var 工具 set 更新——变量名见下方
              「状态变量」清单；状态未变化时不要重复写入。
            - 记忆（跨会话持久）：有人际关系进展或重要事实时，用 world_book_upsert
              的 note 参数写入来源角色卡记忆（条目 id 带 chara- 前缀 → 角色卡
              memory.md，跨会话跟随角色卡）；无归属条目写入模块记忆。
            - 克制：仅在状态确实变化时更新；不确定时保留原值；不编造未发生的内容。
            状态变量清单：{{stateKeys}}
          variables:
            stateKeys: 心情, 接受值, 关系进度
          params: {}
  # 75-subagent-end.yml — subagent/end 层：默认记录；action=inject-main 时向所属主会话注入配置文本，不改写子代理返回结果。
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：static。
  - id: example-subagent-end
    name: 子代理结束记录（只观察）
    enabled: false
    layer: subagent-end
    then:
      - id: inject
        kind: inject-text
        config:
          id: example-subagent-end
          layer: subagent-end
          strategy: static
          order: 0
          params:
            action: observe
          text: 子代理已结束。请检查其结果，验证后再回复用户。
  # 80-tool-surface.yml — 动作自带执行点，顶层 layer 只是展示归属
  # 规则条件放 if，动作放 then；动作执行点由引擎目录验证，不建立跨层全局顺序。
  # 注入动作内容策略：按动作自身能力。
  - id: tool-surface-resident
    name: 工具面收窄（核心文件与任务集）
    enabled: false
    then:
      - id: narrow-tools
        kind: assembly
        target:
          tools:
            allow:
              - pwsh
              - read
              - write
              - edit
              - glob
              - grep
              - todo_write
              - skill_search
              - skill_load
              - tool_search
            allowFrom:
              tool: tool_search
              key: toolNames
            requireMatch: true
  - id: example-world-book
    name: 世界书条件条目
    enabled: false
    layer: pre-step
    then:
      - id: inject
        kind: inject-text
        config:
          layer: pre-step
          strategy: world-book
          text: 这里是触发后注入的背景知识。
          params:
            constant: false
            keys:
              - 项目
            secondaryKeys:
              - 规范
            selectiveLogic: 0
            caseSensitive: false
            wholeWords: false
            useRegex: false

# BEGIN SHARED PARAMETER REFERENCE
# 以下穷举全部登记键；值是编辑器示例，不承诺等于模块运行时默认值。
# '' / [] 保存时删键；false / 0 保留。按需合并到上方 layerSettings，勿保留重复顶层键。
# layerSettings:
#   pre-step:
#     # 消息批层：共享参数，不属于该层某一条提示词规则。
#     instructionHint: false # 指令路径提示；boolean
#   system-section:
#     # 系统段层：共享参数，不属于该层某一条提示词规则。
#     {}
#   runtime-context:
#     # 运行上下文：共享参数，不属于该层某一条提示词规则。
#     {}
#   agent-request:
#     # 调用配置层：共享参数，不属于该层某一条提示词规则。
#     modelProvider: "" # 模型服务商；string
