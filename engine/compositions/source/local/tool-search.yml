# module: tool-search
# source: engine/compositions/source/local/tool-search.yml (本地附加,非官方模块)
#
# 工具面的按需发现与解锁。与 assembly 动作的 allowFrom 配对使用：
#   本工具把解锁名写进持久 tool/call 参数 → allowFrom 读回 → 下次请求起生效。
# 只挂本行而不配 allowFrom 的话，解锁是一次性的（当次请求用完即被裁掉）。
#
# 常驻集由模板声明（见 templates/ 的工具面收窄模板），本行只负责发现入口。

- id: tool-search
  name: ./engine/tool-search.mjs
