# module: custom-bash
# source: engine/compositions/source/local/custom-bash.yml (本地附加,上游 dsh-anchored-standard 移植)
# Windows Git Bash 适配；普通 tool-bash 在 anchored 组合中永久关闭。

- id: custom-bash
  name: ./engine/custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 120000
    maxOutputBytes: 64000
