# module: present-as-ptc
# source: engine/compositions/source/local/present-as-ptc.yml (本地附加,非官方模块)
# 让本模块覆盖的 Agent 以 **PTC 形态**呈现工具：注册表只贡献保留的 `run_code` 传输与生成的
# SDK 段，其余可见能力由程序内绑定（`tools.xxx()`）调用。
#
# 为什么不用官方 `@deepseek-ai/dsh-agent-tool-presentation` 行：本行是插件自己的实现
# （engine/present-as.mjs 调的是同一个 `ctx.tools.presentAs`），模块可经 `modules:` 声明它，
# 因此**不需要在预设侧再挂官方行**，也不需要动 `cordis.patch.yml`（那条只用于进程级默认呈现）。
# 两者落在不同 scope——本行 = Agent scope、官方行 = 预设常驻 scope，`modeFor` 最近者优先；
# 而**同一 scope 二次声明会被官方拒绝**（挂载期 fail loud，不静默覆盖）。
#
# 前置：需要 `ctx.ptcRuntime`（宿主 base bundle 的 `ptc-runtime` 行提供）。缺它时本行停在
# pending，由预设注册表指名报告不可用的行——不静默退回 native。

- id: present-as-ptc
  name: ./engine/present-as.mjs
  config:
    enabled: true
    mode: ptc
