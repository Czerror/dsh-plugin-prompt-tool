# module: deliberation-gate
# source: engine/compositions/source/local/deliberation-gate.yml (本地附加,上游 dsh-anchored-standard 移植)
# 轨迹深度门：首工具调用前流式深思 < minChars 时 deny 一次（规划式提示）。
# 本行是门限与拒绝文案的归属地（引擎不内置）；默认 enabled: false，
# 启用 = params.deliberationGate（UI 开关）或本行 config.enabled: true。

- id: deliberation-gate
  name: ./engine/deliberation-gate.mjs
  config:
    enabled: false
    minChars: 400
    maxGatesPerTurn: 1
    gateText: >-
      Deliberation gate: this turn has not shown its reasoning yet. Before retrying this tool
      call, write out your full reasoning in your reply — start with "We", restate the goal,
      weigh the approaches, and lay out the concrete steps and risks — then issue the tool
      call again. This message is a planning prompt, not a tool failure.
