# module: tool-bootstrap
# source: engine/compositions/source/local/tool-bootstrap.yml (本地附加,上游 dsh-anchored-standard 移植)
# 首轮仅暴露 Minimal 双工具；晋升后恢复完整目录，压缩后回到受控工具集。
# 本行是首轮工具面、门控回退步数与渐进披露机制的归属地（引擎不内置）。

- id: tool-bootstrap
  name: ./engine/tool-bootstrap.mjs
  config:
    bootstrapTools: [bash, str_replace_editor]
    promoteOn: either
    includeSubagents: false
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]
    maxPromoteSteps: 4
    stagePreUnlock: 1
    stageAdvanceTool: phase_advance
    stageAdvanceDescription: >-
      Declare the current stage complete and advance to the next stage (unlocks more tools).
      Call only when the current stage is genuinely done. Pre-unlocked tools are directly
      callable — using one jumps straight to its stage.
    stageSectionTemplate: >-
      Stage {{stageName}} ({{stage}}/{{total}}). Unlocked tools: {{unlocked}}.
      Advance via {{advanceTool}} when the current stage is done.
