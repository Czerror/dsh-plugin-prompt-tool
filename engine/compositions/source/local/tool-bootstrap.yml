# module: tool-bootstrap
# source: engine/compositions/source/local/tool-bootstrap.yml (本地附加,上游 dsh-anchored-standard 移植)
# 首轮仅暴露 Minimal 双工具；晋升后恢复完整目录，压缩后回到受控工具集。

- id: tool-bootstrap
  name: ./engine/tool-bootstrap.mjs
  config:
    bootstrapTools: [bash, str_replace_editor]
    promoteOn: either
    includeSubagents: false
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]
