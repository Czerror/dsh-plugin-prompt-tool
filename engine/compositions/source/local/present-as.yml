# module: present-as
# source: engine/compositions/source/local/present-as.yml (本地附加,非官方模块)
# 在真实 Agent scope 按 `config.mode` 挂载官方 native/PTC 执行器，等待导入与初始化。
# `ptc` 只声明保留的 `run_code` 传输与生成的 SDK 段，其余可见能力由程序内绑定
# （`tools.xxx()`）调用。
#
# 行名与引擎模块文件 `engine/present-as.mjs` 对齐，由 Agent 装配通道挂载。
#
# 模块经 `modules:` 声明本行即可，不需要改 profile patch；
# 同 scope 的执行器冲突由官方拒绝。主/子模式覆盖省略时继承 mode。
#
# `mode: ptc` 通过动态注入等待 `ctx.ptcRuntime`，native 不依赖它。
# 卸载、禁用或运行时撤回后，新批次明确不可用，已接受批次按原执行器排空；
# 显式重挂有效执行器后恢复，不自动回退祖先或 native。

- id: present-as
  name: ./engine/present-as.mjs
  config:
    enabled: true
    mode: ptc
