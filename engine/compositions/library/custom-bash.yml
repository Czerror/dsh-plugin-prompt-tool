# module: custom-bash
# source: preset/engine/compositions/source/local/custom-bash.yml (本地附加,非官方模块)

- id: custom-bash
  name: ./engine/custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 120000
    maxOutputBytes: 64000

